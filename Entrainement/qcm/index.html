<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QCM cardio — collège CNEC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3efe6;
      --card: #faf7f0;
      --ink: #1a2a22;
      --muted: #5a6a60;
      --line: #cfc6b4;
      --ok: #166534;
      --ok-bg: #dcfce7;
      --bad: #991b1b;
      --bad-bg: #fee2e2;
      --accent: #1f5c45;
      --warn: #8a5a12;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Manrope", system-ui, sans-serif;
      background: radial-gradient(90% 60% at 100% 0%, #e5ecdf, transparent 50%), var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }
    main { max-width: 42rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    main.wide { max-width: 54rem; }
    h1 { font-size: 1.25rem; margin: 0 0 0.35rem; }
    .sub { color: var(--muted); font-size: 0.95rem; margin: 0 0 1.25rem; }
    .meta { color: var(--muted); font-size: 0.9rem; }
    a { color: var(--accent); }
    .nav-chips {
      display: flex; flex-wrap: wrap; gap: 0.4rem;
      margin: 0 0 1.15rem; padding: 0; list-style: none;
    }
    .nav-chips button {
      font-size: 0.78rem; font-weight: 600; color: var(--muted);
      background: var(--card); border: 1px solid var(--line);
      border-radius: 999px; padding: 0.4rem 0.7rem; cursor: pointer; font-family: inherit;
    }
    .nav-chips button.active { color: #fff; background: var(--accent); border-color: var(--accent); }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 1.1rem 1.15rem; margin-bottom: 1rem;
    }
    .card h2 {
      font-size: 0.95rem; margin: 0 0 0.75rem;
      letter-spacing: 0.02em; text-transform: uppercase; color: var(--muted);
    }
    .chapters { display: grid; grid-template-columns: 1fr 1fr; gap: 0.35rem 0.75rem; }
    @media (max-width: 520px) { .chapters { grid-template-columns: 1fr; } }
    .chapters label {
      display: flex; gap: 0.5rem; align-items: flex-start;
      font-size: 0.92rem; cursor: pointer; padding: 0.35rem 0.2rem;
    }
    .group-title { font-size: 0.8rem; color: var(--muted); margin: 0.7rem 0 0.25rem; grid-column: 1 / -1; }
    .row { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; align-items: end; }
    .field label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.3rem; }
    input[type="number"], select {
      font: inherit; padding: 0.4rem 0.55rem; border-radius: 8px;
      border: 1px solid var(--line); background: #fff; min-width: 5.5rem;
    }
    .hint { font-size: 0.85rem; color: var(--muted); margin-top: 0.5rem; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0 0 0.65rem; }
    header.quiz-bar {
      display: flex; flex-wrap: wrap; justify-content: space-between;
      gap: 0.75rem; align-items: center; margin-bottom: 1rem;
    }
    .stem { font-size: 1.05rem; margin: 0 0 1rem; white-space: pre-wrap; }
    .choice {
      display: flex; gap: 0.65rem; align-items: flex-start;
      padding: 0.65rem 0.7rem; border: 1px solid var(--line);
      border-radius: 10px; margin-bottom: 0.5rem; cursor: pointer; background: var(--card);
    }
    .choice:has(input:checked) { border-color: var(--accent); background: #e3efe8; }
    .choice.reveal-ok { border-color: #86efac; background: var(--ok-bg); }
    .choice.reveal-bad { border-color: #fca5a5; background: var(--bad-bg); }
    .choice.reveal-miss { border-color: #86efac; background: var(--ok-bg); outline: 1px dashed var(--ok); }
    .choice input { margin-top: 0.2rem; }
    .why { display: none; margin: 0.35rem 0 0; font-size: 0.9rem; color: var(--muted); }
    .revealed .why { display: block; }
    .mark { font-weight: 700; font-size: 0.85rem; }
    .mark.ok { color: var(--ok); }
    .mark.bad { color: var(--bad); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    button.pill, .actions button {
      border: 1px solid var(--accent); background: var(--accent); color: #fff;
      border-radius: 999px; padding: 0.55rem 1rem; font: inherit; font-weight: 650; cursor: pointer;
    }
    button.secondary, .actions button.secondary {
      background: var(--card); color: var(--ink); border-color: var(--line);
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .focus-hero {
      background: linear-gradient(145deg, #1f5c45 0%, #2f7a5c 55%, #3a6b52 100%);
      color: #fff; border: none;
    }
    .focus-hero h2 {
      color: rgba(255,255,255,0.9); text-transform: none; letter-spacing: 0;
      font-size: 1.2rem; font-weight: 800; margin: 0 0 0.35rem;
    }
    .focus-hero p { margin: 0 0 0.9rem; opacity: 0.92; font-size: 0.95rem; }
    .focus-hero .actions button {
      background: #fff; color: var(--accent); border-color: #fff;
      font-size: 1.05rem; padding: 0.7rem 1.35rem;
    }
    .focus-hero .actions button.secondary {
      background: transparent; color: #fff; border-color: rgba(255,255,255,0.55);
    }
    .focus-timer {
      font-variant-numeric: tabular-nums; font-weight: 800; font-size: 1.1rem;
      padding: 0.3rem 0.65rem; border-radius: 999px;
      background: #e3efe8; color: var(--accent);
    }
    .focus-timer.warn { background: var(--bad-bg); color: var(--bad); animation: pulse 1s ease infinite; }
    @keyframes pulse { 50% { opacity: 0.7; } }
    .xp-bar {
      display: grid; grid-template-columns: auto 1fr auto; gap: 0.55rem 0.75rem;
      align-items: center; margin: 0 0 1rem; padding: 0.7rem 0.85rem;
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    }
    .xp-bar .streak {
      font-weight: 800; font-size: 0.95rem; color: var(--warn);
      white-space: nowrap;
    }
    .xp-bar .lvl { font-weight: 750; font-size: 0.88rem; }
    .xp-bar .lvl span { color: var(--muted); font-weight: 600; }
    .xp-track {
      grid-column: 1 / -1; height: 8px; background: #e8e2d6; border-radius: 999px; overflow: hidden;
    }
    .xp-track i { display: block; height: 100%; background: var(--accent); border-radius: inherit; width: 0; transition: width 0.4s ease; }
    .xp-gain {
      margin: 0.75rem 0 0; padding: 0.65rem 0.75rem; border-radius: 10px;
      background: #e3efe8; color: var(--accent); font-weight: 700; font-size: 0.95rem;
    }
    .xp-gain.levelup { background: #fef3c7; color: var(--warn); }
    .hub-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; margin: 0 0 1rem;
    }
    @media (max-width: 520px) { .hub-grid { grid-template-columns: 1fr; } }
    .hub-btn {
      display: block; width: 100%; text-align: left;
      border: 1px solid var(--line); background: var(--card); color: var(--ink);
      border-radius: 12px; padding: 0.85rem 0.95rem; cursor: pointer; font: inherit;
    }
    .hub-btn strong { display: block; font-size: 1rem; margin-bottom: 0.2rem; }
    .hub-btn span { color: var(--muted); font-size: 0.82rem; }
    .hub-btn.primary {
      background: linear-gradient(145deg, #1f5c45, #2f7a5c); color: #fff; border: none;
    }
    .hub-btn.primary span { color: rgba(255,255,255,0.85); }
    .pipe-steps {
      display: flex; gap: 0.35rem; flex-wrap: wrap; margin: 0.55rem 0 0;
    }
    .pipe-steps span {
      font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.55rem;
      border-radius: 999px; background: rgba(255,255,255,0.18); color: #fff;
    }
    .pipe-steps span.on { background: #fff; color: var(--accent); }
    .pipe-steps span.done { background: #86efac; color: #14532d; }
    .pipe-steps.dark span { background: #e8e2d6; color: var(--muted); }
    .pipe-steps.dark span.on { background: var(--accent); color: #fff; }
    .pipe-steps.dark span.done { background: #dcfce7; color: var(--ok); }
    .heat-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(5.8rem, 1fr));
      gap: 0.4rem; margin-top: 0.55rem;
    }
    .heat-cell {
      border: none; border-radius: 10px; padding: 0.55rem 0.4rem; cursor: pointer;
      font: inherit; font-size: 0.78rem; font-weight: 700; color: #fff; text-align: center;
    }
    .heat-cell.hot { background: #b91c1c; }
    .heat-cell.warm { background: #b45309; }
    .heat-cell.ok { background: #166534; }
    .heat-cell.fresh { background: #64748b; }
    .flash-card {
      min-height: 11rem; display: flex; flex-direction: column; justify-content: center;
      text-align: center; padding: 1.25rem; cursor: pointer; user-select: none;
    }
    .flash-card .front { font-size: 1.35rem; font-weight: 800; }
    .flash-card .back { font-size: 1.05rem; margin-top: 0.75rem; color: var(--accent); font-weight: 650; }
    .score-box {
      margin-top: 0.85rem; padding: 0.7rem 0.8rem; border-radius: 10px;
      background: #ebe6dc; display: none;
    }
    .score-box.show { display: block; }
    .tags { margin-top: 0.75rem; font-size: 0.8rem; color: var(--muted); }
    .hidden { display: none !important; }
    .big-score {
      font-size: 2.4rem; font-weight: 700; letter-spacing: -0.03em; margin: 0.25rem 0 0.5rem;
    }
    .feedback-block { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--line); }
    .feedback-block h3 { font-size: 1rem; margin: 0 0 0.5rem; }
    .feedback-block ul { margin: 0; padding-left: 1.15rem; }
    .feedback-block li { margin-bottom: 0.4rem; }
    .weak-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.5rem; }
    .chip {
      font-size: 0.8rem; padding: 0.2rem 0.55rem; border-radius: 999px;
      background: #fef3c7; border: 1px solid #fcd34d;
    }
    .recap { margin-top: 1rem; font-size: 0.9rem; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 0.45rem 0.35rem; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
    .bar { height: 8px; background: #ebe6dc; border-radius: 99px; min-width: 70px; overflow: hidden; display: inline-block; vertical-align: middle; }
    .bar > i { display: block; height: 100%; background: var(--ok); }
    .bar.warn > i { background: var(--warn); }
    .bar.bad > i { background: var(--bad); }
    img.qimg { max-width: 100%; border: 1px solid var(--line); border-radius: 8px; margin: 0 0 1rem; background: #fff; }
    .err { color: var(--bad); }
    .table-wrap { overflow-x: auto; }
    .tx-table { font-size: 0.82rem; }
    .tx-table td { vertical-align: top; }
    .tx-table th { white-space: nowrap; }
    .tx-sit { font-weight: 650; min-width: 7.5rem; }
    .search {
      width: 100%; font: inherit; padding: 0.5rem 0.7rem;
      border-radius: 8px; border: 1px solid var(--line); background: #fff;
    }
    .sigle-abbr { font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .badge {
      font-size: 0.68rem; font-weight: 700; margin-left: 0.35rem;
      padding: 0.05rem 0.35rem; border-radius: 999px;
      background: #ebe6dc; color: var(--muted); vertical-align: middle;
    }
    .badge.a { background: var(--ok-bg); color: var(--ok); }
    .badge.b { background: #fef3c7; color: var(--warn); }
    .subchips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0 0 1rem; padding: 0; list-style: none; }
    .subchips button {
      font: inherit; font-size: 0.78rem; font-weight: 650; cursor: pointer;
      border: 1px solid var(--line); background: #fff; color: var(--ink);
      border-radius: 8px; padding: 0.35rem 0.6rem;
    }
    .subchips button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .kw {
      display: inline-block; font-size: 0.75rem; font-weight: 650;
      padding: 0.15rem 0.45rem; border-radius: 999px; margin: 0.15rem 0.2rem 0.15rem 0;
      background: #e3efe8; color: var(--accent);
    }
    .cmp-table { font-size: 0.78rem; }
    .cmp-table th, .cmp-table td { vertical-align: top; min-width: 7.2rem; }
    .cmp-table th:first-child, .cmp-table td:first-child {
      position: sticky; left: 0; background: var(--card); font-weight: 700;
      min-width: 6.2rem; z-index: 1;
    }
    .cmp-table tr.disc td { background: #eef6f1; font-weight: 650; color: var(--accent); }
    .fiche-sec { margin: 0 0 0.85rem; }
    .fiche-sec h3 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin: 0 0 0.35rem; }
    .fiche-sec ul { margin: 0; padding-left: 1.1rem; }
    .fiche-sec li { margin-bottom: 0.28rem; font-size: 0.92rem; }
    .trap {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem;
      padding: 0.7rem 0; border-bottom: 1px solid var(--line);
    }
    @media (max-width: 560px) { .trap { grid-template-columns: 1fr; } }
    .trap .bad-box, .trap .ok-box { border-radius: 10px; padding: 0.55rem 0.65rem; font-size: 0.9rem; }
    .trap .bad-box { background: var(--bad-bg); }
    .trap .ok-box { background: var(--ok-bg); }
    .trap .lab { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 0.25rem; }
    .trap .bad-box .lab { color: var(--bad); }
    .trap .ok-box .lab { color: var(--ok); }
    .seuil-val { font-size: 1.05rem; font-weight: 800; color: var(--accent); margin: 0 0 0.15rem; }
    .ecos-vignette {
      white-space: pre-wrap; font-size: 0.92rem; line-height: 1.5;
      background: #eef4f0; border-radius: 10px; padding: 0.85rem 1rem; margin: 0 0 1rem;
      border-left: 4px solid var(--accent);
    }
    .ecos-step-title { font-size: 0.82rem; font-weight: 700; text-transform: uppercase; color: var(--accent); margin: 0 0 0.5rem; }
    .ecos-progress { display: flex; gap: 0.35rem; margin-bottom: 0.85rem; flex-wrap: wrap; }
    .ecos-dot { width: 0.65rem; height: 0.65rem; border-radius: 50%; background: var(--line); }
    .ecos-dot.done { background: var(--ok); }
    .ecos-dot.cur { background: var(--accent); box-shadow: 0 0 0 2px #c5dfd3; }
    .edn-hero {
      background: linear-gradient(145deg, #2d1f5c, #4a3080); color: #fff; border: none;
    }
    .edn-hero h2 { color: rgba(255,255,255,0.95); text-transform: none; font-size: 1.15rem; }
    .edn-big { font-size: 2.4rem; font-weight: 800; line-height: 1; margin: 0.25rem 0; }
    .edn-parts { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.55rem; }
    .edn-parts span { font-size: 0.72rem; font-weight: 650; padding: 0.2rem 0.5rem; border-radius: 999px; background: rgba(255,255,255,0.15); }
    .oral-front {
      font-size: 1.08rem; font-weight: 650; min-height: 4.5rem; padding: 1rem;
      background: #eef4f0; border-radius: 10px; margin: 0 0 0.75rem;
    }
    .oral-answer { font-size: 0.95rem; color: var(--ink); white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <ul class="nav-chips">
      <li><button type="button" id="tab-setup" class="active">Session</button></li>
      <li><button type="button" id="tab-cours">Cours</button></li>
      <li><button type="button" id="tab-notions">Notions</button></li>
      <li><button type="button" id="tab-arbres">CAT</button></li>
      <li><button type="button" id="tab-ecos">ECOS</button></li>
      <li><button type="button" id="tab-oral">Oral</button></li>
      <li><button type="button" id="tab-tx">Traitements</button></li>
      <li><button type="button" id="tab-fiches">Fiches</button></li>
      <li><button type="button" id="tab-sigles">Sigles</button></li>
      <li><button type="button" id="tab-suivi">Suivi</button></li>
    </ul>
    <div id="view"></div>
    <p class="hint">Si la banque ne charge pas : <code>lancer.bat</code> puis http://127.0.0.1:8765/</p>
  </main>
<script>
const STORE = "college-cardio-qcm-v1";
const UNESS = ["234", "233RA", "233IM", "232", "339", "231", "152", "342", "226", "230"];
let BANK = null;
let TX = { groups: [] };
let SIGLES = { items: [] };
let FICHES = { comparatifs: [], reflexes: [], pieges: [], seuils: [] };
let COURS = [];
let NOTIONS = [];
let ARBRES = [];
let TROUS = { totalGaps: 0, byItem: {} };
let ECOS = [];
let ecosRun = null;
let oralState = null;
let view = "setup";
let arbreState = null; // { id, stepId }
let session = null;
let originMode = "nouveau";
let formatMode = "all";
let rangMode = "all";
let themeMode = "all";
let focusTicker = null;
let flashTicker = null;
let flashState = null;
let coursActiveState = null;
let pipeline = null; // { itemId, step: 'cours'|'qcm'|'srs'|'done', wrongQs: [], rang }

const FOCUS_N = 8;
const FOCUS_MS = 8 * 60 * 1000;
const FLASH_MS = 60 * 1000;
const COURS_ACTIVE_N = 12;
const PIPE_QCM_N = 5;
const EXAM_N = 40;
const EXAM_MS = 60 * 60 * 1000;
const ECG_N = 20;
const ORAL_N = 12;

const $ = (id) => document.getElementById(id);
const viewEl = $("view");

function loadStats() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE)) || {};
    return {
      byItem: s.byItem || {},
      sessions: s.sessions || [],
      xp: s.xp || 0,
      streak: s.streak || 0,
      bestStreak: s.bestStreak || 0,
      lastDay: s.lastDay || null,
      srs: s.srs || {},
      coursCards: s.coursCards || {},
      pipelines: s.pipelines || {},
      exams: s.exams || [],
    };
  } catch {
    return { byItem: {}, sessions: [], xp: 0, streak: 0, bestStreak: 0, lastDay: null, srs: {}, coursCards: {}, pipelines: {}, exams: [] };
  }
}
function saveStats(s) { localStorage.setItem(STORE, JSON.stringify(s)); }

const LEVELS = [
  { level: 1, name: "Externat", need: 0 },
  { level: 2, name: "Interne junior", need: 80 },
  { level: 3, name: "Interne cardio", need: 200 },
  { level: 4, name: "Résident", need: 400 },
  { level: 5, name: "Chef de clinique", need: 700 },
  { level: 6, name: "CNEC ready", need: 1100 },
  { level: 7, name: "EDN beast", need: 1600 },
];

function dayKey(ts = Date.now()) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function dayShift(key, delta) {
  const [y, m, d] = key.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + delta);
  return dayKey(dt.getTime());
}

function levelInfo(xp) {
  let cur = LEVELS[0];
  let next = LEVELS[1] || null;
  for (let i = 0; i < LEVELS.length; i++) {
    if (xp >= LEVELS[i].need) {
      cur = LEVELS[i];
      next = LEVELS[i + 1] || null;
    }
  }
  const floor = cur.need;
  const ceil = next ? next.need : floor + 500;
  const pct = next ? Math.min(100, Math.round(100 * (xp - floor) / (ceil - floor))) : 100;
  return { ...cur, xp, next, pct, toNext: next ? Math.max(0, next.need - xp) : 0 };
}

function computeSessionXp({ n, exactN, focus }) {
  let xp = n * 8 + exactN * 12;
  if (focus) xp += 20;
  if (n >= 5 && exactN === n) xp += 25;
  else if (n >= 5 && exactN / n >= 0.75) xp += 10;
  return xp;
}

function applyGamification(stats, { n, exactN, focus }) {
  const today = dayKey();
  const yesterday = dayShift(today, -1);
  const before = levelInfo(stats.xp || 0);
  let streak = stats.streak || 0;
  let firstToday = false;
  if (stats.lastDay === today) {
    // déjà compté aujourd'hui
  } else if (stats.lastDay === yesterday) {
    streak += 1;
    firstToday = true;
  } else {
    streak = 1;
    firstToday = true;
  }
  let gained = computeSessionXp({ n, exactN, focus });
  if (firstToday) gained += 15;
  if (streak >= 3 && firstToday) gained += Math.min(30, streak * 3);
  stats.xp = (stats.xp || 0) + gained;
  stats.streak = streak;
  stats.bestStreak = Math.max(stats.bestStreak || 0, streak);
  stats.lastDay = today;
  const after = levelInfo(stats.xp);
  return {
    gained,
    firstToday,
    streak,
    bestStreak: stats.bestStreak,
    levelUp: after.level > before.level,
    before,
    after,
  };
}

function xpBarHtml(stats, extra = "") {
  const info = levelInfo(stats.xp || 0);
  const streak = stats.streak || 0;
  const todayDone = stats.lastDay === dayKey();
  return `<div class="xp-bar" aria-label="progression">
    <div class="streak">${streak ? `🔥 ${streak} j` : "🔥 0 j"}${todayDone ? " · ok" : " · à faire"}</div>
    <div class="lvl">Niv. ${info.level} — ${esc(info.name)} <span>· ${info.xp} XP</span></div>
    <div class="meta" style="justify-self:end">${info.next ? `${info.toNext} XP` : "max"}</div>
    <div class="xp-track"><i style="width:${info.pct}%"></i></div>
    ${extra}
  </div>`;
}

const SRS_STEPS = [1, 3, 7]; // jours

function ensureSrs(stats) {
  if (!stats.srs) stats.srs = {};
  return stats.srs;
}

function scheduleWrong(stats, q) {
  const srs = ensureSrs(stats);
  const cur = srs[q.id] || { fails: 0 };
  cur.fails = (cur.fails || 0) + 1;
  cur.interval = 1;
  cur.due = Date.now() + 1 * 86400000;
  cur.item = q.item;
  cur.lastWrong = Date.now();
  srs[q.id] = cur;
}

function scheduleRight(stats, q) {
  const srs = ensureSrs(stats);
  if (!srs[q.id]) return;
  const cur = srs[q.id];
  const idx = SRS_STEPS.indexOf(cur.interval || 1);
  if (idx < 0 || idx >= SRS_STEPS.length - 1) {
    delete srs[q.id];
    return;
  }
  cur.interval = SRS_STEPS[idx + 1];
  cur.due = Date.now() + cur.interval * 86400000;
  srs[q.id] = cur;
}

function srsDueIds(stats) {
  const now = Date.now();
  return Object.entries(stats.srs || {})
    .filter(([, v]) => (v.due || 0) <= now)
    .sort((a, b) => (a[1].due || 0) - (b[1].due || 0))
    .map(([id]) => id);
}

function srsDueQuestions(stats) {
  const ids = new Set(srsDueIds(stats));
  return BANK.questions.filter((q) => ids.has(q.id));
}

function srsPendingCount(stats) {
  return Object.keys(stats.srs || {}).length;
}

function srsNextDueLabel(stats) {
  const future = Object.values(stats.srs || {})
    .map((v) => v.due || 0)
    .filter((t) => t > Date.now())
    .sort((a, b) => a - b);
  if (!future.length) return null;
  const h = Math.max(1, Math.round((future[0] - Date.now()) / 3600000));
  if (h < 24) return `prochaine dans ~${h} h`;
  return `prochaine dans ~${Math.round(h / 24)} j`;
}

function beginSrsSession() {
  clearFocusTicker();
  const stats = loadStats();
  let pool = srsDueQuestions(stats);
  if (!pool.length) {
    const allIds = Object.keys(stats.srs || {});
    pool = BANK.questions.filter((q) => allIds.includes(q.id));
  }
  if (!pool.length) {
    alert("Aucune erreur en file. Rate des QCM pour remplir le carnet SRS.");
    return;
  }
  pool = shuffle(pool).slice(0, Math.min(12, pool.length));
  session = {
    phase: "quiz",
    focus: false,
    srs: true,
    items: [...new Set(pool.map((q) => q.item))],
    qs: pool.map((q) => ({ ...q, picked: [], revealed: false })),

}

function trapsForItems(itemIds) {
  const set = new Set(itemIds.map(String));
  return (FICHES.pieges || []).filter((p) => set.has(String(p.item || ""))).slice(0, 4);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function scoreQ(q, selected) {
  const sel = new Set(selected);
  const cor = new Set(q.correct);
  const letters = q.options.map((o) => o.letter);
  const pczMiss = (q.pcz || []).some((l) => !sel.has(l));
  const sczHit = (q.scz || []).some((l) => sel.has(l));
  if (pczMiss || sczHit) return { exact: false, pts: 0, max: letters.length, pczMiss, sczHit };
  let pts = 0;
  for (const L of letters) if (sel.has(L) === cor.has(L)) pts++;
  return { exact: pts === letters.length && sel.size === cor.size, pts, max: letters.length, pczMiss: false, sczHit: false };
}

function itemLabel(id) {
  return (BANK.items.find((x) => x.id === id) || {}).label || id;
}

function countFor(it) {
  if (originMode === "nouveau") return it.nNouveau || 0;
  if (originMode === "college") return it.nCollege || 0;
  return (it.nNouveau || 0) + (it.nCollege || 0);
}

function qRang(q) {
  const r = String(q.rang || "A").toUpperCase();
  return r === "B" || r === "C" ? r : "A";
}

function poolFor(ids) {
  return BANK.questions.filter((q) => {
    if (!ids.includes(q.item)) return false;
    if (originMode !== "both" && (q.origin || "college") !== originMode) return false;
    if (formatMode !== "all" && (q.format || "standard") !== formatMode) return false;
    if (rangMode !== "all" && qRang(q) !== rangMode) return false;
    if (themeMode === "traitement" && q.theme !== "traitement") return false;
    if (themeMode === "trou" && q.theme !== "trou") return false;
    if (themeMode === "ecg" && q.theme !== "ecg") return false;
    return true;
  });
}

function selectedIds() {
  return [...document.querySelectorAll("#chapter-list input:checked")].map((i) => i.value);
}

function clearFocusTicker() {
  if (focusTicker) { clearInterval(focusTicker); focusTicker = null; }
  if (flashTicker) { clearInterval(flashTicker); flashTicker = null; }
}

function itemWeakness(id) {
  const s = loadStats().byItem[id];
  if (!s || !s.seen) return UNESS.includes(id) ? 0.78 : 0.62;
  const exactRate = s.exact / Math.max(1, s.seen);
  const ptsRate = s.max ? s.pts / s.max : exactRate;
  return Math.max(0.08, 1 - (0.55 * exactRate + 0.45 * ptsRate));
}

function weightedSample(pool, weights, n) {
  const items = pool.map((q, i) => ({ q, w: weights[i] }));
  const out = [];
  const used = new Set();
  while (out.length < n && items.length) {
    const total = items.reduce((s, x) => s + x.w, 0);
    let r = Math.random() * total;
    let idx = 0;
    for (; idx < items.length; idx++) {
      r -= items[idx].w;
      if (r <= 0) break;
    }
    idx = Math.min(idx, items.length - 1);
    const pick = items.splice(idx, 1)[0];
    if (used.has(pick.q.id)) continue;
    used.add(pick.q.id);
    out.push(pick.q);
  }
  return out;
}

function focusRemainingMs() {
  if (!session || !session.endsAt) return 0;
  return Math.max(0, session.endsAt - Date.now());
}

function formatFocusClock(ms) {
  const s = Math.ceil(ms / 1000);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${m}:${String(r).padStart(2, "0")}`;
}

function startFocusTicker() {
  clearFocusTicker();
  focusTicker = setInterval(() => {
    if (!session || session.phase !== "quiz" || (!session.focus && !session.exam)) { clearFocusTicker(); return; }
    const el = $("focus-clock");
    const left = focusRemainingMs();
    if (el) {
      el.textContent = formatFocusClock(left);
      const warnAt = session.exam ? 5 * 60_000 : 60_000;
      el.classList.toggle("warn", left <= warnAt);
    }
    if (left <= 0) {
      clearFocusTicker();
      finishSession();
    }
  }, 250);
}

function beginFocusSession() {
  clearFocusTicker();
  pipeline = null;
  const prev = { originMode, formatMode, rangMode, themeMode };
  originMode = "both";
  formatMode = "all";
  rangMode = "all";
  themeMode = "all";
  const ids = BANK.items.map((it) => it.id);
  const pool = poolFor(ids);
  if (!pool.length) {
    originMode = prev.originMode;
    formatMode = prev.formatMode;
    rangMode = prev.rangMode;
    themeMode = prev.themeMode;
    alert("Aucune question disponible.");
    return;
  }
  const weights = pool.map((q) => {
    let w = itemWeakness(q.item);
    if (q.origin === "nouveau") w *= 1.15;
    if (UNESS.includes(q.item)) w *= 1.1;
    return w;
  });
  const picked = weightedSample(pool, weights, Math.min(FOCUS_N, pool.length));
  session = {
    phase: "quiz",
    focus: true,
    items: [...new Set(picked.map((q) => q.item))],
    qs: picked.map((q) => ({ ...q, picked: [], revealed: false })),
    i: 0,
    endsAt: Date.now() + FOCUS_MS,
  };
  originMode = prev.originMode;
  formatMode = prev.formatMode;
  rangMode = prev.rangMode;
  themeMode = prev.themeMode;
  view = "quiz";
  render();
  startFocusTicker();
}

function beginExamSession() {
  clearFocusTicker();
  pipeline = null;
  const prev = { originMode, formatMode, rangMode, themeMode };
  originMode = "both";
  formatMode = "all";
  rangMode = "A";
  themeMode = "all";
  const ids = BANK.items.map((it) => it.id);
  const pool = poolFor(ids).filter((q) => q.theme !== "trou");
  if (pool.length < 10) {
    originMode = prev.originMode;
    formatMode = prev.formatMode;
    rangMode = prev.rangMode;
    themeMode = prev.themeMode;
    alert("Pas assez de questions pour un examen blanc.");
    return;
  }
  const byItem = {};
  for (const q of pool) (byItem[q.item] ||= []).push(q);
  const picked = [];
  const used = new Set();
  let round = 0;
  while (picked.length < EXAM_N && round < 12) {
    for (const id of shuffle([...ids])) {
      if (picked.length >= EXAM_N) break;
      const arr = byItem[id];
      if (!arr || !arr.length) continue;
      const q = arr[Math.floor(Math.random() * arr.length)];
      if (used.has(q.id)) continue;
      used.add(q.id);
      picked.push(q);
    }
    round++;
  }
  if (picked.length < EXAM_N) {
    for (const q of shuffle(pool)) {
      if (picked.length >= EXAM_N) break;
      if (used.has(q.id)) continue;
      used.add(q.id);
      picked.push(q);
    }
  }
  session = {
    phase: "quiz",
    exam: true,
    focus: false,
    items: [...new Set(picked.map((q) => q.item))],
    qs: picked.slice(0, EXAM_N).map((q) => ({ ...q, picked: [], revealed: false, locked: false })),
    i: 0,
    endsAt: Date.now() + EXAM_MS,
    startedAt: Date.now(),
  };
  originMode = prev.originMode;
  formatMode = prev.formatMode;
  rangMode = prev.rangMode;
  themeMode = prev.themeMode;
  view = "quiz";
  render();
  startFocusTicker();
}

function buildFlashDeck() {
  const cards = [];
  for (const s of (FICHES.seuils || [])) {
    cards.push({
      kind: "seuil",
      front: s.label || s.group,
      back: `${s.value}${s.note ? " — " + s.note : ""}`,
      item: s.item,
    });
  }
  for (const s of (SIGLES.items || []).slice(0, 80)) {
    cards.push({
      kind: "sigle",
      front: s.abbr,
      back: s.def,
      item: null,
    });
  }
  return shuffle(cards);
}

function beginFlashSession() {
  clearFocusTicker();
  const deck = buildFlashDeck();
  if (!deck.length) { alert("Pas de flashcards (seuils/sigles)."); return; }
  flashState = {
    deck: deck.slice(0, 40),
    i: 0,
    revealed: false,
    known: 0,
    unknown: 0,
    endsAt: Date.now() + FLASH_MS,
  };
  session = null;
  view = "flash";
  render();
  flashTicker = setInterval(() => {
    if (!flashState || view !== "flash") { clearFocusTicker(); return; }
    const el = $("flash-clock");
    const left = Math.max(0, flashState.endsAt - Date.now());
    if (el) {
      el.textContent = formatFocusClock(left);
      el.classList.toggle("warn", left <= 15_000);
    }
    if (left <= 0) finishFlash();
  }, 250);
}

function finishFlash() {
  clearFocusTicker();
  if (!flashState) { view = "setup"; render(); return; }
  const stats = loadStats();
  const seen = flashState.known + flashState.unknown;
  const exactN = flashState.known;
  const gamify = applyGamification(stats, { n: Math.max(1, seen), exactN, focus: false });
  // softer XP for flash: already applied full - reduce by saving adjusted? Keep simple.
  saveStats(stats);
  const summary = { known: flashState.known, unknown: flashState.unknown, seen, gamify };
  flashState = { done: true, summary };
  view = "flash";
  render();
}

    renderFlash();
  };
  $("flash-ko").onclick = () => {
    flashState.unknown++;
    flashState.i++;
    flashState.revealed = false;
    renderFlash();
  };
  $("flash-stop").onclick = () => finishFlash();
}

function coursCardId(item, rang, idx) {
  return `${item}-${rang}-${idx}`;
}

function coursBlock(text) {
  const t = String(text || "").toLowerCase();
  if (/seuil|mmhg|g\/l|≤|≥|< |%|bpm|min|score|cha2|has-bled|wells|spesi|nyha|fevg|ldl/.test(t)) return "Seuils / chiffres";
  if (/traitement|aco|aod|avk|aspirine|statine|iec|bb|bêta|diurétique|dapt|fibrinol|amiodarone|gliflozine|arn/i.test(t)) return "Traitement";
  if (/diagnostic|ecg|echo|ett|eto|tdm|biopsie|bnP|troponine|holter|irm/.test(t)) return "Diagnostic";
  if (/urgence|choc|détresse|oap|réanimation|tamponnade|syncope|15|usic/.test(t)) return "Urgence";
  if (/défini|est une|est le|classif|mécanisme|étiologie|facteur/.test(t)) return "Définition / mécanisme";
  return "Point clé";
}

function coursCardWeight(stats, card, itemId) {
  const rec = (stats.coursCards || {})[card.id] || {};
  let w = itemWeakness(itemId) + 0.35;
  if (rec.due && rec.due <= Date.now()) w += 2.5;
  else if (!rec.ok && !rec.ko) w += 1.2;
  else if ((rec.ko || 0) > (rec.ok || 0)) w += 1.8;
  if (card.rang === "A") w += 0.4;
  return w;
}

function buildCoursDeck({ itemId = "all", rang = "A", n = COURS_ACTIVE_N } = {}) {
  const stats = loadStats();
  const cards = [];
  for (const c of COURS) {
    if (itemId !== "all" && c.item !== itemId) continue;
    if (rang === "A" || rang === "all") {
      (c.rangA || []).forEach((text, i) => {
        cards.push({
          id: coursCardId(c.item, "A", i),
          item: c.item,
          label: c.label,
          rang: "A",
          block: coursBlock(text),
          text,
        });
      });
    }
    if (rang === "B" || rang === "all") {
      (c.rangB || []).forEach((text, i) => {
        cards.push({
          id: coursCardId(c.item, "B", i),
          item: c.item,
          label: c.label,
          rang: "B",
          block: coursBlock(text),
          text,
        });
      });
    }
  }
  if (!cards.length) return [];
  const weights = cards.map((card) => coursCardWeight(stats, card, card.item));
  return weightedSample(cards, weights, Math.min(n, cards.length));
}

function markCoursCard(stats, cardId, known) {
  if (!stats.coursCards) stats.coursCards = {};
  const cur = stats.coursCards[cardId] || { ok: 0, ko: 0, step: 0 };
  if (known) {
    cur.ok = (cur.ok || 0) + 1;
    cur.step = Math.min(3, (cur.step || 0) + 1);
    if (cur.step >= 3) stats.coursCards[cardId] = { mastered: true, ok: cur.ok };
    else {
      cur.due = Date.now() + [1, 3, 7][cur.step - 1] * 86400000;
      stats.coursCards[cardId] = cur;
    }
  } else {
    cur.ko = (cur.ko || 0) + 1;
    cur.step = 0;
    cur.due = Date.now() + 86400000;
    stats.coursCards[cardId] = cur;
  }
}

function coursProgressForItem(stats, c) {
  const total = (c.rangA || []).length + (c.rangB || []).length;
  if (!total) return { total: 0, mastered: 0, due: 0 };
  let mastered = 0;
  let due = 0;
  const now = Date.now();
  const check = (item, rang, len) => {
    for (let i = 0; i < len; i++) {
      const r = (stats.coursCards || {})[coursCardId(item, rang, i)];
      if (r && r.mastered) mastered++;
      else if (r && r.due && r.due <= now) due++;
    }
  };
  check(c.item, "A", (c.rangA || []).length);
  check(c.item, "B", (c.rangB || []).length);
  return { total, mastered, due };
}

function ednReadyForItem(stats, itemId) {
  const it = BANK.items.find((x) => x.id === itemId);
  const s = stats.byItem[itemId] || { seen: 0, exact: 0, pts: 0, max: 0 };
  let qcm = 0;
  if (s.seen >= 3) {
    const exactR = s.exact / s.seen;
    const ptsR = s.max ? s.pts / s.max : exactR;
    qcm = Math.round(100 * (0.55 * exactR + 0.45 * ptsR));
  } else if (s.seen) qcm = Math.min(40, s.seen * 8);
  const cours = COURS.find((c) => c.item === itemId);
  let coursPct = 0;
  if (cours) {
    const p = coursProgressForItem(stats, cours);
    coursPct = p.total ? Math.round(100 * p.mastered / p.total) : 0;
  }
  const pipe = !!(stats.pipelines || {})[itemId];
  const pipePct = pipe ? 100 : 0;
  const itemSrs = Object.entries(stats.srs || {}).filter(([, v]) => v.item === itemId && (v.due || 0) <= Date.now()).length;
  const srsPct = Math.max(0, 100 - itemSrs * 20);
  const gaps = trousCount(itemId);
  const trousPct = gaps ? Math.max(0, 100 - gaps * 12) : 100;
  const pct = Math.round(
    qcm * 0.32 + coursPct * 0.23 + pipePct * 0.25 + srsPct * 0.1 + trousPct * 0.1
  );
  return { pct, qcm, coursPct, pipePct, pipe, srsPct, trousPct, label: it?.label || itemId, itemId };
}

function ednReadyGlobal(stats) {
  const items = BANK.items.map((it) => ednReadyForItem(stats, it.id));
  const avg = items.length
    ? Math.round(items.reduce((n, x) => n + x.pct, 0) / items.length)
    : 0;
  const exams = stats.exams || [];
  const bestExam = exams.length ? Math.max(...exams.map((e) => e.pct || 0)) : null;
  const examBonus = bestExam != null ? Math.round(bestExam * 0.25) : 0;
  const global = Math.min(100, Math.round(avg * 0.75 + examBonus));
  let tier = "Externe";
  if (global >= 85) tier = "EDN beast";
  else if (global >= 75) tier = "CNEC ready";
  else if (global >= 60) tier = "Résident";
  else if (global >= 40) tier = "Interne";
  const weakest = items.slice().sort((a, b) => a.pct - b.pct).slice(0, 3);
  return { global, avg, bestExam, tier, items, weakest };
}

function ednReadyHtml(stats) {
  const g = ednReadyGlobal(stats);
  const examTxt = g.bestExam != null ? ` · examen ${g.bestExam}%` : "";
  const parts = g.weakest.map((w) => `${w.label.replace(/^(\d+\w*)\s*/, "$1 ")} ${w.pct}%`).join(" · ");
  return `<div class="card edn-hero focus-hero">
    <h2>EDN ready</h2>
    <div class="edn-big">${g.global}%</div>
    <p style="margin:0;opacity:0.92">${esc(g.tier)}${examTxt} · moyenne items ${g.avg}%</p>
    <div class="edn-parts">
      <span>QCM</span><span>Cours</span><span>Pipeline</span><span>SRS</span><span>Trous</span>
    </div>
    ${parts ? `<p style="opacity:0.82;font-size:0.82rem;margin:0.55rem 0 0">À muscler : ${esc(parts)}</p>` : ""}
  </div>`;
}

function buildOralDeck(n = ORAL_N) {
  const stats = loadStats();
  const deck = [];
  for (const c of COURS) {
    const w = itemWeakness(c.item) + (UNESS.includes(c.item) ? 0.15 : 0);
    (c.rangA || []).forEach((text, i) => {
      deck.push({
        id: `oral-${c.item}-A-${i}`,
        item: c.item,
        prompt: `[${c.label}] Point essentiel Rang A — réponds à voix haute :`,
        answer: text,
        w: w + (coursProgressForItem(stats, c).due ? 0.2 : 0),
      });
    });
  }
  for (const r of FICHES.reflexes || []) {
    if (!r.item) continue;
    deck.push({
      id: `oral-ref-${r.item}-${deck.length}`,
      item: r.item,
      prompt: `Réflexe EDN — ${itemLabel(r.item)} :`,
      answer: r.reflexe || r.text || "",
      w: itemWeakness(r.item) + 0.1,
    });
  }
  for (const p of (FICHES.pieges || []).slice(0, 20)) {
    deck.push({
      id: `oral-piege-${p.item}-${deck.length}`,
      item: p.item,
      prompt: `Piège vs réflexe — ${itemLabel(p.item)}. Quel est le réflexe ?`,
      answer: `${p.reflexe || ""} (piège : ${p.piege || ""})`,
      w: itemWeakness(p.item) + 0.12,
    });
  }
  if (!deck.length) return [];
  const weights = deck.map((d) => d.w);
  return weightedSample(deck, weights, Math.min(n, deck.length));
}

function beginOralSession() {
  clearFocusTicker();
  pipeline = null;
  const deck = buildOralDeck();
  if (!deck.length) { alert("Pas de contenu oral (cours requis)."); return; }
  oralState = { deck, i: 0, revealed: false, known: 0, unknown: 0 };
  view = "oral";
  render();
}

function pickPipelineItem() {
  const stats = loadStats();
  const scored = BANK.items.map((it) => {
    const pipe = (stats.pipelines || {})[it.id] || {};
    const days = pipe.completedAt ? (Date.now() - pipe.completedAt) / 86400000 : 99;
    let w = itemWeakness(it.id);
    if (UNESS.includes(it.id)) w *= 1.15;
    if (!pipe.completedAt) w += 0.35;
    else if (days > 7) w += 0.25;
    else w -= 0.2;
    return { id: it.id, w };
  }).sort((a, b) => b.w - a.w);
  return scored[0]?.id || BANK.items[0]?.id;
}

function pipeStepsHtml(step, dark = false) {
  const order = ["cours", "qcm", "srs", "done"];
  const labels = { cours: "1. Cours", qcm: "2. QCM", srs: "3. Erreurs", done: "OK" };
  const idx = order.indexOf(step);
  return `<div class="pipe-steps${dark ? " dark" : ""}">${order.map((s, i) => {
    let cls = "";
    if (s === "done" && step === "done") cls = "done";
    else if (i < idx || (step === "done" && s !== "done")) cls = "done";
    else if (s === step) cls = "on";
    return `<span class="${cls}">${labels[s]}</span>`;
  }).join("")}</div>`;
}

function beginPipeline(itemId = null) {
  clearFocusTicker();
  const id = itemId || pickPipelineItem();
  if (!id) { alert("Aucun item."); return; }
  const hasCours = COURS.some((c) => c.item === id);
  pipeline = { itemId: id, step: hasCours ? "cours" : "qcm", wrongQs: [], rang: "A" };
  flashState = null;
  coursActiveState = null;
  if (hasCours) beginCoursActive(id, "A", true);
  else pipelineContinueQcm();
}

function pipelineContinueQcm() {
  if (!pipeline) return;
  pipeline.step = "qcm";
  coursActiveState = null;
  const prev = { originMode, formatMode, rangMode, themeMode };
  originMode = "both";
  formatMode = "all";
  rangMode = "all";
  themeMode = "all";
  const ids = [pipeline.itemId];
  let pool = shuffle(poolFor(ids));
  if (!pool.length) {
    originMode = prev.originMode;
    formatMode = prev.formatMode;
    rangMode = prev.rangMode;
    themeMode = prev.themeMode;
    alert(`Pas de QCM pour ${itemLabel(pipeline.itemId)}.`);
    pipeline = null;
    view = "setup";
    render();
    return;
  }
  const n = Math.min(PIPE_QCM_N, pool.length);
  session = {
    phase: "quiz",
    focus: false,
    srs: false,
    pipeline: true,
    items: ids,
    qs: pool.slice(0, n).map((q) => ({ ...q, picked: [], revealed: false })),
    i: 0,
  };
  originMode = prev.originMode;
  formatMode = prev.formatMode;
  rangMode = prev.rangMode;
  themeMode = prev.themeMode;
  view = "quiz";
  render();
}

function pipelineContinueSrs(wrongQs) {
  if (!pipeline) return;
  pipeline.step = "srs";
  pipeline.wrongQs = wrongQs.map((q) => q.id);
  const pool = shuffle(wrongQs).map((q) => ({ ...q, picked: [], _sc: null, revealed: false }));
  session = {
    phase: "quiz",
    focus: false,
    srs: true,
    pipeline: true,
    items: [pipeline.itemId],
    qs: pool,
    i: 0,
  };
  view = "quiz";
  render();
}

function completePipelineItem(stats) {
  if (!pipeline) return;
  const id = pipeline.itemId;
  if (!stats.pipelines) stats.pipelines = {};
  const cur = stats.pipelines[id] || { count: 0 };
  cur.count = (cur.count || 0) + 1;
  cur.completedAt = Date.now();
  stats.pipelines[id] = cur;
  pipeline.step = "done";
}

function beginCoursActive(itemId = "all", rang = "A", fromPipeline = false) {
  clearFocusTicker();
  const deck = buildCoursDeck({ itemId, rang, n: COURS_ACTIVE_N });
  if (!deck.length) {
    if (fromPipeline && pipeline) { pipelineContinueQcm(); return; }
    alert("Aucun point de cours pour ce filtre.");
    return;
  }
  if (!fromPipeline) pipeline = null;
  else if (pipeline) pipeline.step = "cours";
  coursActiveState = {
    deck,
    i: 0,
    revealed: false,
    known: 0,
    unknown: 0,
    itemId,
    rang,
    pipeline: !!fromPipeline,
  };
  session = null;
  flashState = null;
  view = "cours-active";
  render();
}

function finishCoursActive() {
  if (!coursActiveState) { view = "cours"; render(); return; }
  const stats = loadStats();
  const seen = coursActiveState.known + coursActiveState.unknown;
  const gamify = applyGamification(stats, { n: Math.max(1, seen), exactN: coursActiveState.known, focus: false });
  saveStats(stats);
  const summary = {
    itemId: coursActiveState.itemId,
    rang: coursActiveState.rang,
    known: coursActiveState.known,
    unknown: coursActiveState.unknown,
    seen,
    gamify,
    pipeline: !!coursActiveState.pipeline,
  };
  coursActiveState = { done: true, summary };
  view = "cours-active";
  render();
}

function renderCoursActive() {
  if (coursActiveState && coursActiveState.done) {
    const s = coursActiveState.summary;
    const inPipe = s.pipeline && pipeline;
    viewEl.innerHTML = `
      <h1>${inPipe ? "Pipeline — cours OK" : "Cours actif — terminé"}</h1>
      ${inPipe ? pipeStepsHtml("qcm", true) : ""}
      ${xpBarHtml(loadStats(), `<div class="xp-gain">+${s.gamify.gained} XP · ${s.known} OK / ${s.unknown} à revoir</div>`)}
      <div class="card">
        <div class="big-score">${s.known} / ${s.seen || 0}</div>
        <p class="hint">${inPipe
          ? `Étape suivante : ${PIPE_QCM_N} QCM sur ${esc(itemLabel(s.itemId))}.`
          : "Les points « à revoir » reviennent demain dans le mode actif."}</p>
        <div class="actions">
          ${inPipe
            ? `<button type="button" id="ca-pipe-next">Suite → ${PIPE_QCM_N} QCM</button>
               <button type="button" class="secondary" id="ca-pipe-abort">Quitter le pipeline</button>`
            : `<button type="button" id="ca-again">Encore 12 points</button>
               <button type="button" class="secondary" id="ca-qcm" ${s.itemId && s.itemId !== "all" ? "" : "disabled"}>5 QCM sur l’item</button>
               <button type="button" class="secondary" id="ca-cours">Retour Cours</button>`}
        </div>
      </div>`;
    if (inPipe) {
      $("ca-pipe-next").onclick = () => pipelineContinueQcm();
      $("ca-pipe-abort").onclick = () => { pipeline = null; coursActiveState = null; view = "setup"; render(); };
    } else {
      $("ca-again").onclick = () => beginCoursActive(s.itemId, s.rang);
      $("ca-cours").onclick = () => { coursActiveState = null; view = "cours"; render(); };
      const qcm = $("ca-qcm");
      if (qcm && s.itemId && s.itemId !== "all") {
        qcm.onclick = () => {
          coursActiveState = null;
          originMode = "both";
          formatMode = "all";
          rangMode = "all";
          themeMode = "all";
          beginSession([s.itemId], Math.min(5, poolFor([s.itemId]).length || 5));
        };
      }
    }
    return;
  }
  if (!coursActiveState || !coursActiveState.deck.length) { view = "cours"; render(); return; }
  const c = coursActiveState.deck[coursActiveState.i];
  const left = coursActiveState.deck.length - coursActiveState.i;
  const inPipe = !!coursActiveState.pipeline;
  viewEl.innerHTML = `
    <header class="quiz-bar">
      <h1>${inPipe ? "Pipeline · Cours" : "Cours actif"}</h1>
      <div class="meta">${coursActiveState.i + 1} / ${coursActiveState.deck.length} · ${esc(c.label)} · <span class="badge ${c.rang === "A" ? "a" : "b"}">Rang ${c.rang}</span> · ${esc(c.block)}</div>
    </header>
    ${inPipe ? pipeStepsHtml("cours", true) : ""}
    <div class="card flash-card" id="ca-tap">
      <p class="hint" style="margin:0 0 0.5rem">${esc(c.block)} — ${esc(c.label)}</p>
      <div class="front">${coursActiveState.revealed ? esc(c.text) : "???"}</div>
      ${coursActiveState.revealed ? "" : `<p class="hint">Rappelle-toi le point, puis tape pour révéler</p>`}
    </div>
    <div class="actions">
      <button type="button" id="ca-ok" ${coursActiveState.revealed ? "" : "disabled"}>Je savais</button>
      <button type="button" class="secondary" id="ca-ko" ${coursActiveState.revealed ? "" : "disabled"}>À revoir</button>
      <button type="button" class="secondary" id="ca-stop">${inPipe ? "Passer aux QCM" : `Stop (${left} restant${left > 1 ? "s" : ""})`}</button>
    </div>`;
  $("ca-tap").onclick = () => { coursActiveState.revealed = true; renderCoursActive(); };
  const nextCard = (known) => {
    const stats = loadStats();
    markCoursCard(stats, c.id, known);
    saveStats(stats);
    if (known) coursActiveState.known++;
    else coursActiveState.unknown++;
    coursActiveState.i++;
    coursActiveState.revealed = false;
    if (coursActiveState.i >= coursActiveState.deck.length) finishCoursActive();
    else renderCoursActive();
  };
  $("ca-ok").onclick = () => nextCard(true);
  $("ca-ko").onclick = () => nextCard(false);
  $("ca-stop").onclick = () => {
    if (inPipe && pipeline) { finishCoursActive(); }
    else finishCoursActive();
  };
}

function heatClass(it) {
  const w = itemWeakness(it.id);
  const seen = (loadStats().byItem[it.id] || {}).seen || 0;
  if (!seen) return "fresh";
  if (w >= 0.55) return "hot";
  if (w >= 0.35) return "warm";
  return "ok";
}

function decideNextAction() {
  const stats = loadStats();
  const due = srsDueIds(stats).length;
  const hour = new Date().getHours();
  const g = ednReadyGlobal(stats);
  if (due > 0) return { kind: "srs", label: "SRS erreurs dues" };
  const lastExam = (stats.exams || [])[0];
  const examOld = !lastExam || Date.now() - lastExam.ts > 7 * 86400000;
  if (examOld && (g.bestExam == null || g.bestExam < 70)) {
    return { kind: "exam", label: "Examen blanc EDN" };
  }
  const w0 = g.weakest[0];
  if (w0 && !w0.pipe && w0.pct < 55) {
    return { kind: "pipeline", id: w0.itemId, label: `Pipeline · ${w0.label}` };
  }
  if (w0 && w0.coursPct < 40) {
    return { kind: "oral", id: w0.itemId, label: `Oral · ${w0.label}` };
  }
  const pipeId = pickPipelineItem();
  if (!stats.lastDay || stats.lastDay !== dayKey()) {
    return { kind: "pipeline", id: pipeId, label: `Pipeline · ${itemLabel(pipeId)}` };
  }
  if (hour >= 22 || hour < 8) return { kind: "flash", label: "Flash 60 s (léger)" };
  if (g.global >= 60 && examOld) return { kind: "exam", label: "Examen blanc — entraînement" };
  return { kind: "pipeline", id: pipeId, label: `Pipeline · ${itemLabel(pipeId)}` };
}

function runDecidedAction(act) {
  if (act.kind === "srs") beginSrsSession();
  else if (act.kind === "flash") beginFlashSession();
  else if (act.kind === "micro") beginMicroSession(act.id, 5);
  else if (act.kind === "pipeline") beginPipeline(act.id || null);
  else if (act.kind === "exam") beginExamSession();
  else if (act.kind === "oral") beginOralSession();
  else if (act.kind === "ecos") { ecosRun = null; view = "ecos"; render(); }
  else beginFocusSession();
}

    .slice(0, 3)
    .map((x) => x.seen ? x.label : `${x.label} (nouveau)`)
    .join(" · ");
  const dueN = srsDueIds(stats).length;
  const pendingN = srsPendingCount(stats);

    return `<button type="button" class="heat-cell ${cls}" data-heat="${it.id}" title="${esc(it.label)}">${esc(short.length > 18 ? it.id : short)}</button>`;
  }).join("");

  const pipePick = pickPipelineItem();
  const pipeDoneN = Object.keys(stats.pipelines || {}).length;
  const trousN = trousCount();
  const trousPreview = Object.entries(TROUS.byItem || {})
    .sort((a, b) => (b[1].n || 0) - (a[1].n || 0))
    .slice(0, 4)
    .map(([id, x]) => `${(x.label || id).replace(/^(\d+\w*)\s*/, "$1 ")} (${x.n})`)
    .join(" · ");
  const lastExam = (stats.exams || [])[0];
  const examHist = lastExam
    ? `Dernier : ${lastExam.pct}% · ${lastExam.exact}/${lastExam.n} · ${Math.round((lastExam.durationMs || 0) / 60000)} min`
    : "Pas encore passé";
  const ecgN = BANK ? ecgPool().length : 0;
  const ecgImgN = BANK ? ecgImagePool().length : 0;
  const ecosN = ECOS.length;

  $("btn-start").onclick = () => {
    const ids = selectedIds();
    const n = Math.min(Math.max(1, Number($("qcount").value) || 20), poolFor(ids).length);
    beginSession(ids, n);
  };
  updatePoolHint();
}

function beginSession(ids, nWanted) {
  clearFocusTicker();
  pipeline = null;
  if (!ids.length) { alert("Choisis au moins un item."); return; }
  let pool = shuffle(poolFor(ids));
  const n = Math.min(nWanted, pool.length);
  if (!n) { alert("Pas de questions pour ces items."); return; }
  session = {
    phase: "quiz",
    focus: false,
    srs: false,
    pipeline: false,
    items: ids,
    qs: pool.slice(0, n).map((q) => ({ ...q, picked: [], revealed: false })),
    i: 0,
  };
  view = "quiz";
  render();
}

function renderQuiz() {
  const q = session.qs[session.i];
  const n = session.qs.length;
  const revealed = !!q.revealed;
  const cor = new Set(q.correct);
  const sel = new Set(q.picked);
  const kind = q.kind === "QRU" ? "QRU" : "QRM";
  const origin = q.origin === "nouveau" ? "neuve" : "QI livre";
  const format = q.format === "cas_clinique" ? "cas clinique" : "standard";
  const theme = q.theme === "traitement" ? " · ttt" : q.theme === "trou" ? " · trou" : q.theme === "ecg" ? " · ecg" : "";
  const showCorrection = revealed && !session.exam;
  if (showCorrection && !q._sc) q._sc = scoreQ(q, q.picked);

  let choices = "";
  for (const o of q.options) {
    const should = cor.has(o.letter);
    const did = sel.has(o.letter);
    let cls = "choice";
    if (showCorrection) {
      if (should) cls += did ? " reveal-ok" : " reveal-miss";
      else if (did) cls += " reveal-bad";
    }
    const pcz = (q.pcz || []).includes(o.letter) ? " · PCZ" : "";
    const scz = (q.scz || []).includes(o.letter) ? " · SCZ" : "";
    const extra = o.why ? ` — ${esc(o.why)}` : "";
    const why = showCorrection
      ? `<span class="why"><span class="mark ${should ? "ok" : "bad"}">${should ? "Vrai" : "Faux"}</span>${pcz}${scz}${extra}</span>`
      : `<span class="why"></span>`;
    const type = q.kind === "QRU" ? "radio" : "checkbox";
    const disabled = showCorrection || (session.exam && q.locked);
    choices += `<label class="${cls}" data-letter="${o.letter}">
      <input type="${type}" name="choice" value="${o.letter}" ${did ? "checked" : ""} ${disabled ? "disabled" : ""} />
      <span><strong>${o.letter}.</strong> ${esc(o.text)}${why}</span>
    </label>`;
  }

  let scoreBox = "";
  if (showCorrection) {
    const sc = q._sc;
    const pickedTxt = q.picked.length ? q.picked.join(", ") : "(rien)";
    const reflex = (() => {
      const traps = trapsForItems([q.item]);
      if (traps.length) return traps[0].reflexe;
      const cours = (COURS || []).find((c) => String(c.item) === String(q.item));
      if (cours && cours.rangA && cours.rangA[0]) return cours.rangA[0];
      const exp = String(q.explanation || "").replace(/\*\*/g, "").trim();
      if (!exp) return null;
      const first = exp.split(/(?<=[.!?])\s+/)[0];
      return first.length > 180 ? first.slice(0, 177) + "…" : first;
    })();
    scoreBox = sc.exact
      ? `<strong>OK</strong> — réponse <strong>${q.correct.join(", ")}</strong>.`
      : `<strong>À revoir</strong> — tu as coché <strong>${pickedTxt}</strong> · corrigé <strong>${q.correct.join(", ")}</strong>${sc.pczMiss ? " · PCZ manqué (0)" : ""}${sc.sczHit ? " · SCZ coché (0)" : ""}.`;
    if (reflex) scoreBox = `<div class="xp-gain" style="margin-bottom:0.55rem">Réflexe — ${esc(reflex)}</div>` + scoreBox;
    scoreBox += `<div style="margin-top:0.55rem">${esc(q.explanation).replace(/\*\*/g, "")}</div>`;
    scoreBox += `<p class="hint" style="margin-top:0.55rem"><a href="#" id="link-cours">Cours ${esc(String(q.item))}</a> · <a href="#" id="link-fiche">Fiche réflexe</a></p>`;
  }

  const left = (session.focus || session.exam) ? focusRemainingMs() : null;
  const timerHtml = (session.focus || session.exam)
    ? `<span class="focus-timer${left !== null && left <= (session.exam ? 5 * 60_000 : 60_000) ? " warn" : ""}" id="focus-clock">${formatFocusClock(left || 0)}</span>`
    : "";
  const quizTitle = session.exam ? "Examen blanc EDN"
    : session.ecgImg ? "ECG avec tracé"
    : session.ecg ? "Drill ECG"
    : session.pipeline ? (session.srs ? "Pipeline · Erreurs" : "Pipeline · QCM")
    : session.trous ? "Trous collège"
    : session.focus ? "Focus 8 min"
    : session.srs ? "SRS — erreurs"
    : session.micro ? "Micro-notion"
    : "Session en cours";
  const validateLbl = session.exam
    ? (session.i === n - 1 ? "Terminer l'examen" : "Valider → suivant")
    : "Valider / Corrigé";

  viewEl.innerHTML = `
    <header class="quiz-bar">
      <h1>${quizTitle}</h1>
      <div style="display:flex;gap:0.65rem;align-items:center;flex-wrap:wrap">
        ${timerHtml}
        <div class="meta">${session.i + 1} / ${n} · ${itemLabel(q.item)} · rang ${qRang(q)} · ${kind} · ${format}${theme} · ${origin}${session.exam ? " · pas de retour" : ""}</div>
      </div>
    </header>
    <div class="card ${showCorrection ? "revealed" : ""}">
      <p class="stem">${esc(q.prompt)}</p>
      ${(q.images || []).map((im) => `<img class="qimg" alt="${esc(im.alt)}" src="${esc(im.src)}" />`).join("")}
      <div id="choices">${choices}</div>
      <div class="score-box ${showCorrection ? "show" : ""}">${scoreBox}</div>
      <div class="actions">
        <button type="button" id="btn-validate" ${showCorrection || (session.exam && q.locked) ? "disabled" : ""}>${validateLbl}</button>
        ${session.exam ? "" : `<button type="button" class="secondary" id="btn-next" ${showCorrection ? "" : "disabled"}>${session.i === n - 1 ? "Résultat" : "Suivant"}</button>`}
        <button type="button" class="secondary" id="btn-abort">${session.focus ? "Stop Focus" : session.exam ? "Quitter l'examen" : "Abandonner"}</button>
      </div>
    </div>`;

  if (session.focus || session.exam) startFocusTicker();

  if (!showCorrection && !(session.exam && q.locked)) {
    viewEl.querySelectorAll("#choices input").forEach((inp) => {
      inp.onchange = () => {
        if (q.kind === "QRU") q.picked = [inp.value];
        else q.picked = [...viewEl.querySelectorAll("#choices input:checked")].map((i) => i.value).sort();
      };
    });
    $("btn-validate").onclick = () => {
      if (q.kind === "QRU") {
        const one = viewEl.querySelector("#choices input:checked");
        q.picked = one ? [one.value] : [];
      } else {
        q.picked = [...viewEl.querySelectorAll("#choices input:checked")].map((i) => i.value).sort();
      }
      if (session.exam) {
        q.locked = true;
        if (session.i === n - 1) finishSession();
        else { session.i++; renderQuiz(); }
        return;
      }
      q.revealed = true;
      q._sc = scoreQ(q, q.picked);
      renderQuiz();
    };
  } else if (!session.exam) {
    $("btn-next").onclick = () => {
      if (session.i === n - 1) finishSession();
      else { session.i++; render(); }
    };
    const lc = $("link-cours");
    if (lc) lc.onclick = (e) => {
      e.preventDefault();
      localStorage.setItem("cours-item", q.item);
      localStorage.setItem("cours-rang", "all");
      view = "cours";
      render();
    };
    const lf = $("link-fiche");
    if (lf) lf.onclick = (e) => {
      e.preventDefault();
      window._ficheTab = "reflexes";
      window._ficheItem = q.item;
      view = "fiches";
      render();
    };
  }
  $("btn-abort").onclick = () => {
    if (session.exam) {
      if (!confirm("Terminer l'examen maintenant ? Les questions non validées compteront comme fausses.")) return;
      finishSession();
      return;
    }
    const done = session.qs.some((x) => x.revealed || x.locked);
    if (done) finishSession();
    else {
      clearFocusTicker();
      if (session.pipeline) pipeline = null;
      session = null;
      view = "setup";
      render();
    }
  };
}

function finishSession() {
  clearFocusTicker();
  if (session.exam) {
    for (const q of session.qs) {
      q.revealed = true;
      q._sc = scoreQ(q, q.picked || []);
    }
  }
  const answered = session.qs.filter((q) => q.revealed);
  if (!answered.length) { session = null; view = "setup"; render(); return; }
  const stats = loadStats();
  const perItem = {};
  let exactN = 0, pts = 0, max = 0;
  for (const q of answered) {
    const sc = q._sc || scoreQ(q, q.picked);
    q._sc = sc;
    if (sc.exact) exactN++;
    pts += sc.pts; max += sc.max;
    const b = perItem[q.item] ||= { n: 0, exact: 0, pts: 0, max: 0 };
    b.n++; b.exact += sc.exact ? 1 : 0; b.pts += sc.pts; b.max += sc.max;
  }
  const rec = { ts: Date.now(), n: answered.length, exact: exactN, pts, max, items: session.items, focus: !!session.focus, exam: !!session.exam };
  stats.sessions.unshift(rec);
  stats.sessions = stats.sessions.slice(0, 40);
  if (session.exam) {
    const pct = answered.length ? Math.round(100 * exactN / answered.length) : 0;
    stats.exams.unshift({
      ts: Date.now(),
      n: answered.length,
      exact: exactN,
      pct,
      durationMs: Date.now() - (session.startedAt || Date.now()),
    });
    stats.exams = stats.exams.slice(0, 20);
  }
  for (const [id, b] of Object.entries(perItem)) {
    const cur = stats.byItem[id] ||= { seen: 0, exact: 0, pts: 0, max: 0 };
    cur.seen += b.n; cur.exact += b.exact; cur.pts += b.pts; cur.max += b.max;
    cur.last = rec.ts;
  }
  for (const q of answered) {
    if (session.exam) continue;
    if (q._sc && q._sc.exact) scheduleRight(stats, q);
    else scheduleWrong(stats, q);
  }
  const gamify = applyGamification(stats, { n: answered.length, exactN, focus: !!session.focus || !!session.exam });
  const wasPipeline = !!session.pipeline;
  const pipeStep = pipeline ? pipeline.step : null;
  let pipelineDone = false;
  if (wasPipeline && pipeline) {
    if (pipeStep === "srs") {
      completePipelineItem(stats);
      pipelineDone = true;
    } else if (pipeStep === "qcm") {
      const anyWrong = answered.some((q) => !(q._sc && q._sc.exact));
      if (!anyWrong) {
        completePipelineItem(stats);
        pipelineDone = true;
      }
    }
  }
  saveStats(stats);
  session.phase = "done";
  session.answered = answered;
  session.summary = {
    exactN, pts, max, perItem, n: answered.length, gamify,
    pipeline: wasPipeline,
    pipelineStep: pipeStep,
    pipelineItem: pipeline ? pipeline.itemId : null,
    pipelineDone,
    exam: !!session.exam,
    examDurationMs: session.exam ? Date.now() - (session.startedAt || Date.now()) : 0,
    ecg: !!session.ecg,
  };
  view = "results";
  render();
}

function renderResults() {
  const { exactN, pts, max, perItem, n, gamify, pipeline: wasPipe, pipelineStep, pipelineItem, pipelineDone, exam, examDurationMs, ecg } = session.summary;
  const pct = n ? Math.round(100 * exactN / n) : 0;
  const wrong = (session.answered || session.qs).filter((q) => q.revealed && q._sc && !q._sc.exact);
  let feedback;
  if (exam) {
    if (pct >= 80) feedback = "Monstre EDN — niveau examen blanc atteint. Tu peux enchaîner une 2e simu dans 48 h pour consolider.";
    else if (pct >= 70) feedback = "Seuil EDN ok — solide. Repasse les items faibles puis refais un blanc visant 80 %.";
    else if (pct >= 50) feedback = "Mi-parcours — reprends pipeline + trous sur les items les plus rouges avant le prochain blanc.";
    else feedback = "Sous le seuil — priorise Cours actif + 10 QCM/item sur 3 items faibles, puis refais un blanc.";
  } else if (pipelineDone) feedback = `Item ${itemLabel(pipelineItem)} verrouillé. Tu peux enchaîner un autre pipeline ou un Focus.`;
  else if (wasPipe && pipelineStep === "qcm" && wrong.length) feedback = "Pipeline : prochaine étape = refaire les erreurs (SRS). Puis l’item sera marqué OK.";
  else if (wasPipe && pipelineStep === "qcm" && !wrong.length) feedback = "Sans erreur : item verrouillé directement. Beau travail.";
  else if (pct >= 85) feedback = "Très bon niveau sur ce lot. Tu maîtrises bien les notions tirées — garde un rythme de révision courte pour figer.";
  else if (pct >= 65) feedback = "Base solide, avec encore des trous. Relis les explications des items ratés avant de relancer une session ciblée.";
  else if (pct >= 40) feedback = "Session fragile : plusieurs notions ne sont pas encore stabilisées. Mieux vaut revoir le cours sur les thèmes faibles, puis refaire 10–15 QCM.";
  else feedback = "Beaucoup d’erreurs : priorise le cours sur le (les) item(s), puis recommence avec moins de questions.";

  const advice = [];
  if (!wrong.length) {
    advice.push("Parfait : enchaîne sur d’autres items ou augmente le nombre de questions.");
    advice.push("Teste un mix multi-items pour vérifier le transfert.");
  } else {
    advice.push(`Relis le corrigé des ${wrong.length} question${wrong.length > 1 ? "s" : ""} manquée${wrong.length > 1 ? "s" : ""} (surtout les distracteurs « presque vrais »).`);
    const weak = Object.entries(perItem).filter(([, b]) => b.exact < b.n).sort((a, b) => (b[1].n - b[1].exact) - (a[1].n - a[1].exact));
    if (weak.length) {
      advice.push(`Item(s) à revoir : ${weak.slice(0, 3).map(([id, b]) => `${itemLabel(id)} (${b.n - b.exact} erreur${b.n - b.exact > 1 ? "s" : ""})`).join(", ")}.`);
    }
    if (pct < 65) advice.push("Fais une session courte (8–12 Q) sur un seul item faible avant de remélanger.");
    else advice.push("Refais une session aléatoire du même pool dans 24–48 h pour consolider.");
    advice.push("En QRM, vérifie chaque proposition A–E : une seule erreur fait rater la question.");
  }

  const chips = Object.entries(perItem)
    .filter(([, b]) => b.exact < b.n)

    ? pipeStepsHtml(pipeDoneNow ? "done" : showPipeSrs ? "srs" : (pipelineStep === "srs" ? "done" : "qcm"), true)
    : "";

  viewEl.innerHTML = `
    <h1>${pipeDoneNow ? "Pipeline — item OK" : exam ? "Examen blanc — résultat" : ecg ? "Drill ECG terminé" : wasPipe ? (session.srs ? "Pipeline — erreurs" : "Pipeline — QCM") : session.trous ? "Trous combles" : session.focus ? "Focus terminé" : session.srs ? "SRS terminé" : "Résultat"}</h1>
    ${pipeBar}
    <p class="sub">${exam ? `Examen blanc · ${Math.round((examDurationMs || 0) / 60000)} min · ` : ecg ? "Drill ECG · " : wasPipe ? `Pipeline · ${esc(itemLabel(pipelineItem || session.items[0]))} · ` : session.trous ? "Trous collège · " : session.focus ? "Session Focus · " : session.srs ? "Révision espacée · " : ""}${session.items.length} item${session.items.length > 1 ? "s" : ""} · ${n} question${n > 1 ? "s" : ""}${exam ? "" : wrong.length ? ` · ${wrong.length} remis dans le carnet (1→3→7 j)` : ""}</p>
    ${xpBarHtml(loadStats(), gainHtml)}
    <div class="card">
      <div class="meta">Score</div>
      <div class="big-score">${exactN} / ${n}</div>
      <p>${pct} % de questions exactes · ${pts}/${max} propositions A–E</p>
      <div class="feedback-block">
        <h3>Feedback</h3>
        <p>${feedback}</p>
      </div>
      <div class="feedback-block">
        <h3>Conseils</h3>
        <ul>${advice.map((a) => `<li>${a}</li>`).join("")}</ul>
        <div class="weak-tags">${chips}</div>
      </div>
      ${trapsHtml}
      <p class="recap">${exactN} bonne${exactN > 1 ? "s" : ""} · ${wrong.length} à revoir · ${n} question${n > 1 ? "s" : ""}.</p>
      <div class="actions">
        ${showPipeSrs
          ? `<button type="button" id="pipe-srs">Suite → refaire ${wrong.length} erreur${wrong.length > 1 ? "s" : ""}</button>`
          : pipeDoneNow
            ? `<button type="button" id="pipe-again">Autre pipeline</button>`
            : session.focus
              ? `<button type="button" id="again-focus">Encore un Focus</button>`
              : exam
                ? `<button type="button" id="again-exam">Refaire un examen blanc</button>`
                : ecg
                  ? `<button type="button" id="again-ecg">Encore ECG</button>`
                  : session.trous
                ? `<button type="button" id="again-trous">Encore les trous</button>`
                : session.srs
                ? `<button type="button" id="again-srs" ${srsPendingCount(statsNow) ? "" : "disabled"}>Continuer SRS${dueLeft ? ` (${dueLeft})` : ""}</button>`
                : `<button type="button" id="again">Rejouer (mêmes réglages)</button>`}
        <button type="button" class="secondary" id="home">Accueil</button>
        ${!wasPipe ? `<button type="button" class="secondary" id="missed">Refaire les erreurs</button>` : ""}
        <button type="button" class="secondary" id="to-suivi">Voir le suivi</button>
      </div>
    </div>`;
  $("home").onclick = () => { pipeline = null; session = null; view = "setup"; render(); };
  if (showPipeSrs) {
    $("pipe-srs").onclick = () => pipelineContinueSrs(wrong);
  } else if (pipeDoneNow) {
    pipeline = null;
    $("pipe-again").onclick = () => beginPipeline();
  } else if (session.focus) $("again-focus").onclick = () => beginFocusSession();
  else if (exam) $("again-exam").onclick = () => beginExamSession();
  else if (ecg) $("again-ecg").onclick = () => beginEcgSession();
  else if (session.trous) $("again-trous").onclick = () => beginTrousSession();
  else if (session.srs) $("again-srs").onclick = () => beginSrsSession();
  else $("again").onclick = () => beginSession(session.items, n);
  $("to-suivi").onclick = () => { view = "suivi"; render(); };
  const missed = $("missed");
  if (missed) missed.onclick = () => {
    if (!wrong.length) { alert("Aucune erreur dans cette session."); return; }
    clearFocusTicker();
    pipeline = null;
    session = { phase: "quiz", focus: false, srs: false, pipeline: false, items: session.items, qs: shuffle(wrong.map((q) => ({ ...q, picked: [], _sc: null, revealed: false }))), i: 0 };

function renderSuivi() {
  const stats = loadStats();
  const g = ednReadyGlobal(stats);
  const cible = BANK.cible || { seenHigh: 12, pctHigh: 80, seenOther: 8, pctOther: 70 };
  const rows = BANK.items.map((it) => {
    const s = stats.byItem[it.id] || { seen: 0, exact: 0, pts: 0, max: 0 };
    const pct = s.max ? Math.round(100 * s.pts / s.max) : null;
    const needSeen = it.highYield ? cible.seenHigh : cible.seenOther;
    const needPct = it.highYield ? cible.pctHigh : cible.pctOther;
    const ready = s.seen >= needSeen && pct !== null && pct >= needPct;
    const edn = ednReadyForItem(stats, it.id);
    return { ...it, ...s, pct, needSeen, needPct, ready, ednPct: edn.pct, pipe: edn.pipe };
  });
  const high = rows.filter((r) => r.highYield);
  const other = rows.filter((r) => !r.highYield);
  const highOk = high.filter((r) => r.ready).length;
  const otherOk = other.filter((r) => r.ready).length;
  const veryGood = highOk === high.length && otherOk >= Math.ceil(0.8 * other.length);
  const weak = rows.filter((r) => r.seen && !r.ready).sort((a, b) => (a.pct ?? 0) - (b.pct ?? 0));

  let body = "";
  for (const r of rows) {
    const cls = r.ready ? "" : r.pct == null ? "bad" : r.pct >= r.needPct ? "warn" : "bad";
    const bar = r.pct == null ? "—" : `<span class="bar ${cls}"><i style="width:${r.pct}%"></i></span> ${r.pct} %`;
    body += `<tr><td>${r.label}${r.highYield ? " · prio" : ""}${r.pipe ? " 🔒" : ""}</td><td>${r.ednPct}%</td><td>${r.needSeen}/${r.needPct}%</td><td>${r.seen}${r.ready ? " OK" : ""}</td><td>${r.seen ? r.exact + "/" + r.seen : "—"}</td><td>${bar}</td></tr>`;
  }

  viewEl.innerHTML = `
    <h1>Suivi</h1>
    <p class="sub">EDN ready global : <strong>${g.global}%</strong> (${esc(g.tier)}) · ${highOk}/${high.length} items prio · ${otherOk}/${other.length} autres.</p>
    ${ednReadyHtml(stats)}
    ${xpBarHtml(stats, `<div class="meta" style="grid-column:1/-1">Meilleure série : ${stats.bestStreak || 0} jour${(stats.bestStreak || 0) > 1 ? "s" : ""} · SRS : ${srsDueIds(stats).length} due${srsDueIds(stats).length > 1 ? "s" : ""} / ${srsPendingCount(stats)} en file</div>`)}
    <div class="card">
      <h2>Carnet SRS</h2>
      <p class="hint" style="margin-top:0">Les QCM ratés reviennent à J+1, puis J+3, puis J+7. Une bonne réponse avance l’intervalle ; une erreur remet à J+1.</p>
      <div class="actions" style="margin-top:0.5rem">
        <button type="button" id="srs-go" ${srsPendingCount(stats) ? "" : "disabled"}>Réviser le carnet</button>
      </div>
    </div>
    <div class="card">
      <h2>Par item</h2>
      <p class="hint" style="margin-top:0">Prio : ${cible.seenHigh} vues et ${cible.pctHigh} %. Autres : ${cible.seenOther} vues et ${cible.pctOther} %. ${stats.sessions.length} session(s) ici.</p>
      ${weak.length ? `<div class="weak-tags" style="margin-bottom:0.75rem">${weak.map((w) => `<span class="chip">${w.label}</span>`).join("")}</div>
        <div class="actions" style="margin-top:0"><button type="button" id="drill">Session 20 Q sur ces items</button></div>` : ""}
      <table style="margin-top:12px"><thead><tr><th>Item</th><th>EDN</th><th>Cible</th><th>Vues</th><th>Exactes</th><th>Options</th></tr></thead><tbody>${body}</tbody></table>
      <div class="actions">
        <button type="button" class="secondary" id="reset">Réinitialiser le suivi</button>
      </div>
    </div>`;
  $("reset").onclick = () => {
    if (confirm("Effacer tout le suivi local (XP, série et SRS inclus) ?")) { localStorage.removeItem(STORE); render(); }
  };
  const drill = $("drill");
  if (drill) drill.onclick = () => beginSession(weak.map((w) => w.id), 20);
  const srsGo = $("srs-go");
  if (srsGo) srsGo.onclick = () => beginSrsSession();
}

function ficheTab() { return window._ficheTab || "comparatifs"; }
function ficheItem() { return window._ficheItem || "all"; }
function ficheQ() { return (window._ficheQ || "").trim().toLowerCase(); }

function ficheMatches(blob, q) {
  if (!q) return true;
  return blob.toLowerCase().includes(q);
}

function qTextBlob(q) {
  const opts = (q.options || []).map((o) => o.text || "").join(" ");
  return `${q.prompt || ""} ${q.explanation || ""} ${opts}`.toLowerCase();
}

function poolForNotion(notion) {
  const items = new Set((notion.items || []).map(String));
  const kws = (notion.keywords || []).map((k) => k.toLowerCase());
  return BANK.questions.filter((q) => {
    if (!items.has(String(q.item))) return false;
    if (!kws.length) return true;
    const blob = qTextBlob(q);
    return kws.some((k) => blob.includes(k.toLowerCase()));
  });
}

function beginMicroSession(notionId, nWanted = 5) {
  clearFocusTicker();
  const notion = NOTIONS.find((n) => n.id === notionId);
  if (!notion) { alert("Notion introuvable."); return; }
  let pool = poolForNotion(notion);
  if (pool.length < nWanted) {
    const items = new Set((notion.items || []).map(String));
    const extra = BANK.questions.filter((q) => items.has(String(q.item)) && !pool.includes(q));
    pool = pool.concat(shuffle(extra));
  }
  pool = shuffle(pool).slice(0, Math.min(nWanted, pool.length));
  if (!pool.length) { alert("Pas assez de QCM pour cette notion."); return; }
  session = {
    phase: "quiz",
    focus: false,
    srs: false,
    micro: notion.id,
    items: [...new Set(pool.map((q) => q.item))],
    qs: pool.map((q) => ({ ...q, picked: [], revealed: false })),
    i: 0,
  };
  view = "quiz";
  render();
}

function buildSynthese(itemId) {
  const cours = (COURS || []).find((c) => String(c.item) === String(itemId));
  const reflex = (FICHES.reflexes || []).find((r) => String(r.item) === String(itemId));
  const seuils = (FICHES.seuils || []).filter((s) => String(s.item) === String(itemId)).slice(0, 5);
  const pieges = (FICHES.pieges || []).filter((p) => String(p.item) === String(itemId)).slice(0, 3);
  const def = (cours?.rangA || []).slice(0, 2);
  const rangB = (cours?.rangB || []).slice(0, 1);
  return { cours, reflex, seuils, pieges, def, rangB };
}

function syntheseHtml(itemId) {
  const s = buildSynthese(itemId);
  if (!s.cours && !s.reflex) return "";
  let html = `<div class="fiche-sec" style="background:#eef6f1;border-radius:10px;padding:0.75rem;margin-bottom:0.85rem">
    <h3 style="margin:0 0 0.45rem;color:var(--accent)">Synthèse 1 écran</h3>`;
  if (s.def.length) {
    html += `<p class="meta" style="margin:0 0 0.25rem">Définition</p><ul>`;
    s.def.forEach((p) => { html += `<li>${esc(p)}</li>`; });
    html += `</ul>`;
  }
  if (s.seuils.length) {
    html += `<p class="meta" style="margin:0.55rem 0 0.25rem">Seuils</p>`;
    s.seuils.forEach((x) => {
      html += `<div class="seuil-val" style="font-size:0.95rem">${esc(x.label)} : ${esc(x.value)}</div>`;
    });
  }
  if (s.reflex) {
    const premiere = (s.reflex.arbre && s.reflex.arbre.premiere) || [];
    if (premiere.length) {
      html += `<p class="meta" style="margin:0.55rem 0 0.25rem">CAT</p><ul>`;
      premiere.slice(0, 3).forEach((p) => { html += `<li>${esc(p)}</li>`; });
      html += `</ul>`;
    }
    if (s.reflex.redFlags && s.reflex.redFlags.length) {
      html += `<p class="meta" style="margin:0.55rem 0 0.25rem">Red flags</p><ul>`;
      s.reflex.redFlags.slice(0, 3).forEach((p) => { html += `<li>${esc(p)}</li>`; });
      html += `</ul>`;
    }
  }
  if (s.pieges.length) {
    html += `<p class="meta" style="margin:0.55rem 0 0.25rem">Pièges</p>`;
    s.pieges.forEach((p) => {
      html += `<div class="ok-box" style="margin-bottom:0.35rem;border-radius:8px;padding:0.4rem 0.55rem;background:var(--ok-bg);font-size:0.88rem"><strong>Réflexe</strong> — ${esc(p.reflexe)}</div>`;
    });
  }
  if (s.rangB.length) {
    html += `<p class="meta" style="margin:0.55rem 0 0.25rem">Rang B (1 phrase)</p><ul><li>${esc(s.rangB[0])}</li></ul>`;
  }
  html += `</div>`;
  return html;
}
