function renderEcosPlay() {
  if (!ecosRun) { view = "ecos"; render(); return; }
  const c = ecosRun.case;
  const steps = c.steps || [];
  const step = steps[ecosRun.stepI];
  if (!step) { renderEcosDone(); return; }
  const revealed = ecosRun.revealed;
  const cor = new Set(step.correct || []);
  const sel = new Set(ecosRun.picked || []);
  const kind = step.kind === "QRU" ? "QRU" : "QRM";
  let sc = null;
  if (revealed) {
    sc = scoreQ({ kind: step.kind, options: step.options, correct: step.correct, pcz: step.pcz || [], scz: step.scz || [] }, ecosRun.picked);
  }
  const dots = steps.map((_, i) => {
    let cls = "ecos-dot";
    if (i < ecosRun.stepI) cls += " done";
    if (i === ecosRun.stepI) cls += " cur";
    return `<span class="${cls}"></span>`;
  }).join("");
  let choices = "";
  for (const o of step.options || []) {
    const should = cor.has(o.letter);
    const did = sel.has(o.letter);
    let cls = "choice";
    if (revealed) {
      if (should) cls += did ? " reveal-ok" : " reveal-miss";
      else if (did) cls += " reveal-bad";
    }
    const type = step.kind === "QRU" ? "radio" : "checkbox";
    choices += `<label class="${cls}"><input type="${type}" name="ecos-choice" value="${o.letter}" ${did ? "checked" : ""} ${revealed ? "disabled" : ""} /><span><strong>${o.letter}.</strong> ${esc(o.text)}</span></label>`;
  }
  let scoreBox = "";
  if (revealed && sc) {
    scoreBox = sc.exact
      ? `<strong>OK</strong> — ${esc(step.explanation)}`
      : `<strong>À revoir</strong> — corrigé ${step.correct.join(", ")}. ${esc(step.explanation)}`;
  }
  const hintHtml = step.hint && !revealed
    ? `<p class="hint" id="ecos-hint" style="${ecosRun.hintShown ? "" : "display:none"}"><strong>Indice :</strong> ${esc(step.hint)}</p>`
    : "";
  viewEl.innerHTML = `
    <h2>${esc(c.label || c.id)}</h2>
    <div class="ecos-progress">${dots}</div>
    <div class="card">
      <div class="ecos-vignette">${esc(c.vignette || "")}</div>
      ${(c.images || []).map((im) => `<img class="qimg" alt="${esc(im.alt)}" src="${esc(im.src)}" />`).join("")}
      <div class="ecos-step-title">${esc(step.title || `Station ${ecosRun.stepI + 1}`)} · ${kind}</div>
      <p class="stem">${esc(step.prompt)}</p>
      ${hintHtml}
      <div id="ecos-choices">${choices}</div>
      <div class="score-box ${revealed ? "show" : ""}">${scoreBox}</div>
      <div class="actions">
        ${step.hint && !revealed ? `<button type="button" class="secondary" id="ecos-hint-btn">${ecosRun.hintShown ? "Masquer indice" : "Indice ECOS"}</button>` : ""}
        <button type="button" id="ecos-validate" ${revealed ? "disabled" : ""}>${revealed ? "Corrigé" : "Valider"}</button>
        <button type="button" class="secondary" id="ecos-next" ${revealed ? "" : "disabled"}>${ecosRun.stepI === steps.length - 1 ? "Bilan cas" : "Station suivante"}</button>
        <button type="button" class="secondary" id="ecos-quit">Quitter</button>
      </div>
    </div>`;
  if (!revealed) {
    const hintBtn = $("ecos-hint-btn");
    if (hintBtn) hintBtn.onclick = () => {
      ecosRun.hintShown = !ecosRun.hintShown;
      renderEcosPlay();
    };
    viewEl.querySelectorAll("#ecos-choices input").forEach((inp) => {
      inp.onchange = () => {
        if (step.kind === "QRU") ecosRun.picked = [inp.value];
        else ecosRun.picked = [...viewEl.querySelectorAll("#ecos-choices input:checked")].map((i) => i.value).sort();
      };
    });
    $("ecos-validate").onclick = () => {
      if (step.kind === "QRU") {
        const one = viewEl.querySelector("#ecos-choices input:checked");
        ecosRun.picked = one ? [one.value] : [];
      } else {
        ecosRun.picked = [...viewEl.querySelectorAll("#ecos-choices input:checked")].map((i) => i.value).sort();
      }
      const sc2 = scoreQ({ kind: step.kind, options: step.options, correct: step.correct, pcz: step.pcz || [], scz: step.scz || [] }, ecosRun.picked);
      ecosRun.results.push({ title: step.title, exact: sc2.exact });
      ecosRun.revealed = true;
      renderEcosPlay();
    };
  } else {
    $("ecos-next").onclick = () => {
      if (ecosRun.stepI >= steps.length - 1) renderEcosDone();
      else {
        ecosRun.stepI++;
        ecosRun.picked = [];
        ecosRun.revealed = false;
        ecosRun.hintShown = false;
        renderEcosPlay();
      }
    };
  }
  $("ecos-quit").onclick = () => { ecosRun = null; view = "ecos"; render(); };
}

function renderEcosDone() {
  const c = ecosRun.case;
  const exactN = ecosRun.results.filter((r) => r.exact).length;
  const n = ecosRun.results.length;
  const pct = n ? Math.round(100 * exactN / n) : 0;
  const rows = ecosRun.results.map((r) =>
    `<li>${r.exact ? "✓" : "✗"} ${esc(r.title || "Station")}</li>`
  ).join("");
  viewEl.innerHTML = `
    <h2>Cas terminé — ${esc(c.label || c.id)}</h2>
    <div class="card">
      <div class="big-score">${exactN} / ${n}</div>
      <p>${pct} % · ${pct >= 75 ? "Très bon raisonnement clinique." : pct >= 50 ? "Relis les stations ratées." : "Reprends le cours item puis refais le cas."}</p>
      <ul>${rows}</ul>
      <div class="actions">
        <button type="button" id="ecos-retry">Refaire ce cas</button>
        <button type="button" class="secondary" id="ecos-list">Autres cas ECOS</button>
        <button type="button" class="secondary" id="ecos-setup">Accueil</button>
      </div>
    </div>`;
  $("ecos-retry").onclick = () => beginEcosCase(c.id);
  $("ecos-list").onclick = () => { ecosRun = null; view = "ecos"; render(); };
  $("ecos-setup").onclick = () => { ecosRun = null; view = "setup"; render(); };
}

function renderArbres() {
  if (arbreState && arbreState.id) {
    const tree = ARBRES.find((a) => a.id === arbreState.id);
    if (!tree) { arbreState = null; renderArbres(); return; }
    const step = (tree.steps || []).find((s) => s.id === arbreState.stepId) || tree.steps[0];
    const isEnd = !!step.end;
    viewEl.innerHTML = `
      <header class="quiz-bar">
        <h1>CAT — ${esc(tree.label)}</h1>
        <div class="meta">${esc(tree.root)}</div>
      </header>
      <div class="card flash-card" style="cursor:default;min-height:8rem">
        <div class="front" style="font-size:1.15rem">${esc(step.q)}</div>
        ${step.cat ? `<p class="hint" style="margin-top:0.75rem;color:var(--accent);font-weight:700">Réflexe CAT</p>` : ""}
      </div>
      <div class="actions">
        ${isEnd
          ? `<button type="button" id="arbre-restart">Recommencer</button>
             <button type="button" class="secondary" id="arbre-qcm">5 QCM · ${esc(itemLabel(tree.item))}</button>
             <button type="button" class="secondary" id="arbre-back">Liste CAT</button>`
          : step.auto
            ? `<button type="button" id="arbre-next">Continuer</button>
               <button type="button" class="secondary" id="arbre-back">Liste CAT</button>`
            : `<button type="button" id="arbre-yes">Oui</button>
               <button type="button" class="secondary" id="arbre-no">Non</button>
               <button type="button" class="secondary" id="arbre-back">Liste CAT</button>`}
      </div>`;
    $("arbre-back").onclick = () => { arbreState = null; renderArbres(); };
    if (isEnd) {
      $("arbre-restart").onclick = () => {
        arbreState = { id: tree.id, stepId: tree.steps[0].id };
        renderArbres();
      };
      $("arbre-qcm").onclick = () => {
        arbreState = null;
        originMode = "both";
        formatMode = "all";
        rangMode = "all";
        themeMode = "all";
        beginSession([tree.item], Math.min(5, poolFor([tree.item]).length || 5));
      };
    } else if (step.auto) {
      $("arbre-next").onclick = () => {
        arbreState.stepId = step.yes || step.no;
        renderArbres();
      };
    } else {
      $("arbre-yes").onclick = () => { arbreState.stepId = step.yes; renderArbres(); };
      $("arbre-no").onclick = () => { arbreState.stepId = step.no; renderArbres(); };
    }
    return;
  }
  let html = `<h1>Arbres CAT</h1>
    <p class="sub">Clique Oui/Non — comme au lit du malade. Puis 5 QCM pour figer.</p>`;
  for (const a of ARBRES) {
    html += `<div class="card">
      <h2 style="text-transform:none;letter-spacing:0;font-size:1.05rem;color:var(--ink)">${esc(a.label)}</h2>
      <p class="hint" style="margin-top:0">${esc(a.root)} · ${(a.steps || []).length} nœuds</p>
      <div class="actions">
        <button type="button" data-arbre="${esc(a.id)}">Parcourir</button>
        <button type="button" class="secondary" data-pipe-item="${esc(a.item)}">Pipeline item</button>
      </div>
    </div>`;
  }
  if (!ARBRES.length) html += `<p class="hint">Fichier <code>arbres.json</code> manquant.</p>`;
  viewEl.innerHTML = html;
  viewEl.querySelectorAll("[data-arbre]").forEach((btn) => {
    btn.onclick = () => {
      const id = btn.getAttribute("data-arbre");
      const tree = ARBRES.find((a) => a.id === id);
      arbreState = { id, stepId: tree.steps[0].id };
      renderArbres();
    };
  });
  viewEl.querySelectorAll("[data-pipe-item]").forEach((btn) => {
    btn.onclick = () => beginPipeline(btn.getAttribute("data-pipe-item"));
  });
}

function renderNotions() {
  let html = `<h1>Notions transversales</h1>
    <p class="sub">Les mêmes idées reviennent sur plusieurs items. Verrouille une notion → tu gagnes partout.</p>`;
  for (const n of NOTIONS) {
    const poolN = poolForNotion(n).length;
    const chips = (n.items || []).map((id) => `<span class="chip">${esc(itemLabel(id))}</span>`).join("");
    html += `<div class="card">
      <h2 style="text-transform:none;letter-spacing:0;font-size:1.05rem;color:var(--ink)">${esc(n.label)}</h2>
      <p class="hint" style="margin-top:0">${esc(n.blurb)}</p>
      <div class="weak-tags" style="margin:0.5rem 0">${chips}</div>
      <p class="meta">${poolN} QCM matchés · micro-session = 5 Q</p>
      <div class="actions">
        <button type="button" data-micro="${esc(n.id)}" ${poolN ? "" : "disabled"}>Micro 5 Q</button>

function renderCours() {
  let coursFilter = localStorage.getItem("cours-item") || "all";
  let rangFilter = localStorage.getItem("cours-rang") || "all";
  let activeRang = localStorage.getItem("cours-active-rang") || "A";
  const stats = loadStats();
  const items = COURS.slice().sort((a, b) => a.item.localeCompare(b.item, undefined, { numeric: true }));
  const dueTotal = items.reduce((n, c) => n + coursProgressForItem(stats, c).due, 0);
  let html = `<h2>Cours — Points essentiels</h2>
    <p class="sub">Mode passif en bas · <strong>Cours actif</strong> = tu te rappelles avant de révéler (12 points).</p>
    <div class="card focus-hero" style="background:linear-gradient(145deg,#2a4a6e,#3d6a8a);">
      <h2>Cours actif — 12 points</h2>
      <p>Révèle · Je savais / À revoir · priorité items faibles + points dus${dueTotal ? ` (${dueTotal} dus)` : ""}.</p>
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.75rem;">
        <select id="ca-item" style="font:inherit;padding:0.3rem 0.5rem;border-radius:8px;border:1px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.95);">
          <option value="all"${coursFilter === "all" ? " selected" : ""}>Items faibles (auto)</option>`;
  items.forEach(c => { html += `<option value="${c.item}"${coursFilter === c.item ? " selected" : ""}>${esc(c.label)}</option>`; });
  html += `</select>
        <select id="ca-rang" style="font:inherit;padding:0.3rem 0.5rem;border-radius:8px;border:1px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.95);">
          <option value="A"${activeRang === "A" ? " selected" : ""}>Rang A</option>
          <option value="all"${activeRang === "all" ? " selected" : ""}>A + B</option>
          <option value="B"${activeRang === "B" ? " selected" : ""}>Rang B</option>
        </select>
      </div>
      <div class="actions">
        <button type="button" id="btn-cours-active">Lancer Cours actif</button>
      </div>
    </div>
    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:1rem;">
      <select id="cours-item-filter" style="font:inherit;padding:0.3rem 0.5rem;border-radius:8px;border:1px solid var(--line);">
        <option value="all"${coursFilter === "all" ? " selected" : ""}>Tous les items</option>`;
  items.forEach(c => { html += `<option value="${c.item}"${coursFilter === c.item ? " selected" : ""}>${c.label}</option>`; });
  html += `</select>
      <select id="cours-rang-filter" style="font:inherit;padding:0.3rem 0.5rem;border-radius:8px;border:1px solid var(--line);">
        <option value="all"${rangFilter === "all" ? " selected" : ""}>Rang A + B</option>
        <option value="A"${rangFilter === "A" ? " selected" : ""}>Rang A seul</option>
        <option value="B"${rangFilter === "B" ? " selected" : ""}>Rang B seul</option>
      </select>
    </div>`;
  const filtered = coursFilter === "all" ? items : items.filter(c => c.item === coursFilter);
  filtered.forEach(c => {
    const prog = coursProgressForItem(stats, c);
    const pct = prog.total ? Math.round(100 * prog.mastered / prog.total) : 0;
    html += `<div class="card" style="margin-bottom:1rem;">`;
    html += `<h3 style="margin:0 0 0.35rem;">${esc(c.label)}</h3>`;
    html += `<p class="meta" style="margin:0 0 0.6rem">${prog.mastered}/${prog.total} maîtrisés · ${prog.due ? `${prog.due} à revoir · ` : ""}${pct} %</p>`;
    html += `<div class="xp-track" style="margin-bottom:0.75rem"><i style="width:${pct}%"></i></div>`;
    const gapsN = trousCount(c.item);
    html += `<div class="actions" style="margin:0 0 0.85rem">
      <button type="button" class="secondary pill" data-ca-item="${esc(c.item)}">Actif 12 · ${esc(c.label)}</button>
      <button type="button" class="secondary pill" data-qcm-item="${esc(c.item)}">5 QCM</button>
      <button type="button" class="secondary pill" data-pipe-item="${esc(c.item)}">Pipeline</button>
      ${gapsN ? `<button type="button" class="secondary pill" data-trous-item="${esc(c.item)}">Combler ${gapsN} trou${gapsN > 1 ? "s" : ""}</button>` : ""}
    </div>`;
    if (coursFilter !== "all" || filtered.length === 1) html += syntheseHtml(c.item);
    else html += `<details style="margin-bottom:0.75rem"><summary class="meta" style="cursor:pointer">Synthèse 1 écran</summary>${syntheseHtml(c.item)}</details>`;
    if (rangFilter !== "B" && c.rangA && c.rangA.length) {
      html += `<div class="fiche-sec"><h3><span class="badge a">Rang A</span> Essentiels</h3><ul>`;
      c.rangA.forEach((p, i) => {
        const id = coursCardId(c.item, "A", i);
        const r = (stats.coursCards || {})[id];
        const tag = r && r.mastered ? " ✓" : r && r.due && r.due <= Date.now() ? " ↻" : "";
        html += `<li>${esc(p)}${tag ? `<span class="meta">${tag}</span>` : ""}</li>`;
      });
      html += `</ul></div>`;
    }
    if (rangFilter !== "A" && c.rangB && c.rangB.length) {
      html += `<div class="fiche-sec"><h3><span class="badge b">Rang B</span> Approfondissement</h3><ul>`;
      c.rangB.forEach((p, i) => {
        const id = coursCardId(c.item, "B", i);
        const r = (stats.coursCards || {})[id];
        const tag = r && r.mastered ? " ✓" : r && r.due && r.due <= Date.now() ? " ↻" : "";
        html += `<li>${esc(p)}${tag ? `<span class="meta">${tag}</span>` : ""}</li>`;
      });
      html += `</ul></div>`;
    }
    html += `</div>`;
  });
  if (!filtered.length) html += `<p class="hint">Aucun item trouvé.</p>`;
  viewEl.innerHTML = html;
  $("btn-cours-active").onclick = () => {
    const item = $("ca-item").value;
    const rang = $("ca-rang").value;
    localStorage.setItem("cours-active-rang", rang);
    let pick = item;
    if (pick === "all") {
      const ranked = items.map((c) => ({ c, w: itemWeakness(c.item) + coursProgressForItem(stats, c).due * 0.15 }))
        .sort((a, b) => b.w - a.w);
      pick = ranked[0]?.c.item || items[0]?.item;
      if (!pick) { alert("Pas de cours chargé."); return; }
    } else {
      localStorage.setItem("cours-item", pick);
    }
    beginCoursActive(pick, rang);
  };
  $("cours-item-filter").onchange = (e) => { localStorage.setItem("cours-item", e.target.value); renderCours(); };
  $("cours-rang-filter").onchange = (e) => { localStorage.setItem("cours-rang", e.target.value); renderCours(); };
  viewEl.querySelectorAll("[data-ca-item]").forEach((btn) => {
    btn.onclick = () => beginCoursActive(btn.getAttribute("data-ca-item"), activeRang);
  });
  viewEl.querySelectorAll("[data-qcm-item]").forEach((btn) => {
    btn.onclick = () => {
      const id = btn.getAttribute("data-qcm-item");
      originMode = "both";
      formatMode = "all";
      rangMode = "all";
      themeMode = "all";
      beginSession([id], Math.min(5, poolFor([id]).length || 5));
    };
  });
  viewEl.querySelectorAll("[data-pipe-item]").forEach((btn) => {
    btn.onclick = () => beginPipeline(btn.getAttribute("data-pipe-item"));
  });
  viewEl.querySelectorAll("[data-trous-item]").forEach((btn) => {
    btn.onclick = () => beginTrousSession(btn.getAttribute("data-trous-item"));
  });
}

function renderFiches() {
  const tab = ficheTab();
  const item = ficheItem();
  const q = ficheQ();
  const allItems = [...new Set([
    ...(FICHES.comparatifs || []).flatMap((c) => c.items || []),
    ...(FICHES.reflexes || []).map((r) => r.item),
    ...(FICHES.pieges || []).map((p) => p.item),
    ...(FICHES.seuils || []).map((s) => s.item),
  ].filter(Boolean))];
  const itemOpts = [`<option value="all"${item === "all" ? " selected" : ""}>Tous les items</option>`]
    .concat(allItems.map((id) => `<option value="${esc(id)}"${item === id ? " selected" : ""}>${esc(itemLabel(id))}</option>`))
    .join("");
  const tabs = [
    ["comparatifs", "Comparatifs"],
    ["reflexes", "Réflexes"],
    ["pieges", "Pièges"],
    ["seuils", "Seuils"],
  ].map(([id, lab]) => `<li><button type="button" data-ft="${id}" class="${tab === id ? "active" : ""}">${lab}</button></li>`).join("");

  let body = "";
  if (tab === "comparatifs") body = renderComparatifs(item, q);
  else if (tab === "reflexes") body = renderReflexes(item, q);
  else if (tab === "pieges") body = renderPieges(item, q);
  else body = renderSeuils(item, q);

  const nC = (FICHES.comparatifs || []).length;
  const nR = (FICHES.reflexes || []).length;
  const nP = (FICHES.pieges || []).length;
  const nS = (FICHES.seuils || []).length;
  viewEl.innerHTML = `
    <h1>Fiches EDN</h1>
    <p class="sub">${nC} comparatifs · ${nR} réflexes · ${nP} pièges · ${nS} seuils — d’après le CNEC 3e, pas d’annales UNESS.</p>
    <ul class="subchips">${tabs}</ul>
    <div class="card">
      <div class="row">
        <div class="field" style="flex:1; min-width:12rem">
          <label for="fiche-q">Recherche</label>
          <input class="search" id="fiche-q" type="search" placeholder="BASIC, CHA2DS2-VA, TNT, QRS…" value="${esc(window._ficheQ || "")}" />
        </div>
        <div class="field">
          <label for="fiche-item">Item</label>
          <select id="fiche-item">${itemOpts}</select>
        </div>
      </div>
      <p class="hint">${FICHES.source || ""}</p>
    </div>
    ${body}`;
  $("fiche-q").oninput = () => { window._ficheQ = $("fiche-q").value; renderFiches(); };
  $("fiche-item").onchange = () => { window._ficheItem = $("fiche-item").value; renderFiches(); };
  const fq = $("fiche-q");
  if (fq) {
    fq.focus();
    try { fq.setSelectionRange(fq.value.length, fq.value.length); } catch {}
  }
  viewEl.querySelectorAll("[data-ft]").forEach((btn) => {
    btn.onclick = () => { window._ficheTab = btn.getAttribute("data-ft"); renderFiches(); };
  });
  viewEl.querySelectorAll(".fiche-qcm-btn").forEach((btn) => {
    btn.onclick = () => {
      const ids = (btn.getAttribute("data-items") || "").split(",").filter(Boolean);
      if (!ids.length) return;
      originMode = "nouveau";
      formatMode = "all";
      rangMode = "all";
      themeMode = "all";
      const n = Math.min(15, poolFor(ids).length);
      if (!n) { alert("Pas de QCM pour cet item dans le filtre actuel."); return; }
      beginSession(ids, n);
    };
  });
}

function renderComparatifs(item, q) {
  const list = (FICHES.comparatifs || []).filter((c) => {
    if (item !== "all" && !(c.items || []).includes(item)) return false;
    return ficheMatches([c.title, ...(c.entities || []), ...(c.discriminants || []), JSON.stringify(c.criteria || [])].join(" "), q);
  });
  if (!list.length) return `<div class="card"><p class="hint">Aucun comparatif.</p></div>`;
  return list.map((c) => {
    const ents = c.entities || [];
    const head = `<tr><th>Critère</th>${ents.map((e) => `<th>${esc(e)}</th>`).join("")}</tr>`;
    const rows = (c.criteria || []).map((row) => {
      const cls = row.key === "Discriminant" ? " class=\"disc\"" : "";
      return `<tr${cls}><td>${esc(row.key)}</td>${(row.values || []).map((v) => `<td>${esc(v)}</td>`).join("")}</tr>`;
    }).join("");
    const discs = (c.discriminants || []).map((d) => `<span class="kw">${esc(d)}</span>`).join("");
    const ids = (c.items || []).join(",");
    return `<div class="card">
      <h2>${esc(c.title)}</h2>
      <div class="table-wrap">
        <table class="tx-table cmp-table">
          <thead>${head}</thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${discs ? `<p style="margin:0.7rem 0 0">${discs}</p>` : ""}
      <div class="actions"><button type="button" class="secondary fiche-qcm-btn" data-items="${esc(ids)}">QCM sur cet item</button></div>
    </div>`;
  }).join("");
}

function renderReflexes(item, q) {
  const list = (FICHES.reflexes || []).filter((r) => {
    if (item !== "all" && r.item !== item) return false;
    return ficheMatches([r.label, ...(r.keywords || []), ...(r.redFlags || []), ...(r.bilan || []), ...(r.rangA || []), ...(r.rangB || [])].join(" "), q);
  });
  if (!list.length) return `<div class="card"><p class="hint">Aucune fiche réflexe.</p></div>`;
  return list.map((r) => {
    const kws = (r.keywords || []).map((k) => `<span class="kw">${esc(k)}</span>`).join("");
    const sec = (title, arr) => arr && arr.length ? `<div class="fiche-sec"><h3>${title}</h3><ul>${arr.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
    const arbre = r.arbre || {};
    return `<div class="card">
      <h2>${esc(r.label)} <span class="badge a">A</span> <span class="badge b">B</span></h2>
      ${kws ? `<p style="margin:0 0 0.75rem">${kws}</p>` : ""}
      ${sec("Signes de gravité", r.redFlags)}
      ${sec("Bilan de 1re intention", r.bilan)}
      ${sec("1re ligne", arbre.premiere)}
      ${sec("Échec / allergie / 2e ligne", arbre.echec)}
      ${sec("Terrains spécifiques", arbre.terrains)}
      ${sec("EI et CI pièges", r.ciei)}
      ${sec("Rang A — à savoir les yeux fermés", r.rangA)}
      ${sec("Rang B — plus spécialisé", r.rangB)}
      <div class="actions"><button type="button" class="secondary fiche-qcm-btn" data-items="${esc(r.item)}">15 QCM de cet item</button></div>
    </div>`;
  }).join("");
}

function renderPieges(item, q) {
  const list = (FICHES.pieges || []).filter((p) => {
    if (item !== "all" && p.item !== item) return false;
    return ficheMatches([p.piege, p.reflexe, p.item].join(" "), q);
  });
  if (!list.length) return `<div class="card"><p class="hint">Aucun piège.</p></div>`;
  const groups = {};
  for (const p of list) (groups[p.item] ||= []).push(p);
  return Object.entries(groups).map(([id, traps]) => `
    <div class="card">
      <h2>${esc(itemLabel(id))}</h2>
      ${traps.map((p) => `<div class="trap">
        <div class="bad-box"><div class="lab">Piège${p.rang ? ` · rang ${esc(p.rang)}` : ""}</div>${esc(p.piege)}</div>
        <div class="ok-box"><div class="lab">Réflexe</div>${esc(p.reflexe)}</div>
      </div>`).join("")}
    </div>`).join("");
}

function renderSeuils(item, q) {
  const list = (FICHES.seuils || []).filter((s) => {
    if (item !== "all" && s.item !== item && !(s.items || []).includes(item)) return false;
    return ficheMatches([s.group, s.label, s.value, s.note].join(" "), q);
  });
  if (!list.length) return `<div class="card"><p class="hint">Aucun seuil.</p></div>`;
  const groups = {};
  for (const s of list) (groups[s.group || "Autres"] ||= []).push(s);
  return Object.entries(groups).map(([g, rows]) => `
    <div class="card">
      <h2>${esc(g)}</h2>
      <div class="table-wrap">
        <table class="tx-table">
          <thead><tr><th>Notion</th><th>Seuil</th><th>À retenir</th></tr></thead>
          <tbody>${rows.map((s) => `<tr>
            <td class="tx-sit">${esc(s.label)}${s.rang ? ` <span class="badge ${s.rang === "B" ? "b" : "a"}">${esc(s.rang)}</span>` : ""}</td>
            <td><div class="seuil-val">${esc(s.value)}</div></td>
            <td>${esc(s.note || "")}</td>
          </tr>`).join("")}</tbody>
        </table>
      </div>
    </div>`).join("");
}

function renderSigles() {
  const q = (window._sigleQ || "").trim().toLowerCase();
  const items = SIGLES.items || [];
  const nExtra = items.filter((x) => x.extra).length;
  const shown = items.filter((x) => {
    if (!q) return true;
    return (x.abbr || "").toLowerCase().includes(q) || (x.def || "").toLowerCase().includes(q);
  });
  const rows = shown.map((x) => `<tr>
    <td class="sigle-abbr">${esc(x.abbr)}${x.extra ? '<span class="badge">cours</span>' : ""}</td>
    <td>${esc(x.def)}</td>
  </tr>`).join("");
  viewEl.innerHTML = `
    <h1>Sigles</h1>
    <p class="sub">${items.length} abréviations · liste liminaire du collège CNEC 3e éd.${nExtra ? ` · ${nExtra} ajouts fréquents des cours` : ""}.</p>
    <div class="card">
      <h2>Rechercher</h2>
      <input class="search" id="sigle-q" type="search" placeholder="BASIC, FEVG, CHA2DS2-VA…" value="${esc(window._sigleQ || "")}" />
      <p class="hint">${shown.length} résultat${shown.length > 1 ? "s" : ""}. ${SIGLES.source || ""}</p>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table class="tx-table">
          <thead><tr><th>Sigle</th><th>Signification</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="2">Aucun sigle ne correspond.</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
  const inp = $("sigle-q");
  if (inp) {
    inp.focus();
    const pos = inp.value.length;
    try { inp.setSelectionRange(pos, pos); } catch {}
    inp.oninput = () => {
      window._sigleQ = inp.value;
      renderSigles();
    };
  }
}

function esc(s) {
  return String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

boot();
</script>
</body>
</html>
